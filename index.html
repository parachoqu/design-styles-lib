<script type="application/json" data-grupos>{"A": "Fundamentos & Minimalismos", "B": "Sistemas de Produto", "C": "Luz, Vidro & Superfície", "D": "Brutalismos & Anti-design", "E": "Tipografia & Editorial", "F": "Movimentos Históricos", "G": "Nostalgia Digital", "H": "Orgânicos & Artesanais"}</script>
<script type="application/json" id="dsl-facetas">{"composicao": {"nome": "Composição", "opcoes": {"grade": "Grade modular", "assimetrica": "Assimétrica", "centralizada": "Centralizada", "camadas": "Camadas", "colagem": "Colagem", "colunas": "Colunas editoriais"}}, "superficie": {"nome": "Superfície", "opcoes": {"plana": "Plana", "vidro": "Vidro", "relevo": "Relevo", "textura": "Textura", "contorno": "Contorno duro", "gradiente": "Gradiente"}}, "tipografia": {"nome": "Tipografia", "opcoes": {"sans-neutra": "Sans neutra", "display-serif": "Serifa display", "mono": "Monoespaçada", "condensada": "Condensada", "manuscrita": "Manuscrita", "bitmap": "Bitmap", "geometrica": "Geométrica"}}, "movimento": {"nome": "Movimento", "opcoes": {"estatico": "Estático", "sutil": "Sutil", "marquee": "Marquee", "reativo": "Reativo ao cursor"}}}</script>
<script type="application/json" id="dsl-fichas">{"minimalismo": {"principios": "Subtração como método: o que permanece ganha peso porque quase tudo foi removido. A hierarquia nasce de escala e espaço, não de cor ou ornamento.", "composicao": "Faixas horizontais empilhadas — nav, hero estreito (máx. 720px), grade de três células dividida por fio de 1px. O conteúdo alinha à esquerda e nunca ocupa a largura total.", "tipografia": "Uma família só, em três pesos (300 no título e no corpo, 400 no itálico de ênfase, 500 nos rótulos). Título em clamp(34px,5.2vw,58px) com tracking negativo de -.035em; corpo em 16px/1.8.", "espacamento": "Padding de 120px no topo do hero contra 34px da nav: a diferença é a hierarquia. Margens internas em múltiplos de 11px, e o respiro entre blocos é sempre maior que dentro deles.", "cor": "Quatro valores, nenhum saturado: papel quase branco, fio cinza-claro, texto cinza-médio para apoio, quase-preto para o essencial. Nenhuma cor de destaque — o destaque é o contraste de peso.", "superficie": "Totalmente plana. Sem sombra, sem raio, sem preenchimento: a única divisão é o fio de 1px, e ele é mais claro que o texto de apoio.", "movimento": "Praticamente nenhum. Só a transição de cor no link e o CTA que abre o espaço entre texto e seta no hover — feedback, não animação.", "mobile": "A grade de três células vira empilhamento com fio embaixo em vez de à direita; os links da nav somem e o padding do hero cai de 120px para 64px.", "aplicacoes": "Portfólio de estúdio, site institucional, produto onde o conteúdo é o argumento. Funciona mal onde é preciso guiar a atenção com urgência.", "especifico": "A serifa itálica na palavra de ênfase e a paleta de papel envelhecido são escolhas deste exemplo; o minimalismo não exige nem uma coisa nem outra."}, "flat-design": {"principios": "Cor chapada substitui profundidade. Cada bloco é um retângulo de cor com função definida, e a leitura acontece por contraste entre blocos, não por hierarquia tipográfica fina.", "composicao": "Faixas de largura total com centralização dentro de cada uma: nav colorida, hero em tom mais escuro da mesma cor, grade de quatro cards, faixa de estatísticas. Estrutura previsível e repetível.", "tipografia": "Sans neutra em 600/700 para títulos e 500 para rótulos. Escala curta — 42px no h1, 15px nos cards — porque o trabalho de hierarquia é da cor.", "espacamento": "Padding generoso e uniforme (34px nas faixas, 26px nos cards). O gap de 18px entre cards é constante; nada é comprimido para caber.", "cor": "Paleta nomeada e funcional: azul de marca, azul escuro para o hero, verde de ação, e quatro acentos de categoria nos ícones. Cada cor significa algo — nenhuma é decorativa.", "superficie": "Sem gradiente, sem sombra, sem bisel. Raio pequeno e constante (5–6px) apenas para suavizar o retângulo.", "movimento": "Transição de background de 200ms em botão e link. Nada mais: o estilo nasceu como reação ao excesso de efeito.", "mobile": "Cards de quatro para duas colunas em 980px e uma coluna em 520px; as estatísticas acompanham. Os links da nav somem.", "aplicacoes": "SaaS, painel administrativo, produto que precisa parecer direto e confiável. Envelhece rápido como diferencial de marca.", "especifico": "A paleta azul-verde deste exemplo é convencional; o flat aceita qualquer paleta desde que chapada e funcional."}, "estilo-suico": {"principios": "A grade é o argumento. Toda posição precisa ser justificável por uma coluna, e a assimetria é deliberada — nada é centralizado, porque a leitura real não é centralizada.", "composicao": "Doze colunas visíveis como fio vertical tênue. Título ocupa 3/12, lead 3/8, metadados 9/13 com fio à esquerda. A régua vermelha de 14px separa hero de conteúdo.", "tipografia": "Neo-grotesca em 700 caixa-alta no título, com tracking de -.05em e leading 0.92 — o bloco de texto vira uma massa. Rótulos em 10–11px com tracking largo de .16em.", "espacamento": "Gutter de 18px constante entre colunas. Padding lateral de 16px em tudo, sem exceção: a margem é a mesma do topo ao rodapé.", "cor": "Preto, branco e um vermelho de sinal. O vermelho marca numeração, régua e uma palavra do título — nunca preenche área grande nem decora.", "superficie": "Plana e sem raio. Divisões por fio de 1px e 2px; a única área preenchida é a régua vermelha.", "movimento": "Estático. Só o hover da nav, que inverte para preto sólido.", "mobile": "Todos os spans colapsam para 1/13; o bloco de metadados perde o fio lateral e ganha fio superior; o recuo da segunda linha do título é zerado.", "aplicacoes": "Editorial, sinalização, identidade institucional, documentação técnica. Excelente para conteúdo denso que precisa ser navegável.", "especifico": "O vermelho e a proporção 3/8 são deste exemplo. A regra geral é a grade explícita e o alinhamento à esquerda, não a cor escolhida."}, "wabi-sabi": {"principios": "O vazio é material de construção e a imperfeição é conteúdo. O traço incompleto do ensō comunica mais que um círculo fechado comunicaria.", "composicao": "Duas colunas desiguais (1.15 / .85) com o desenho respirando à direita. Faixa de três células no rodapé separada por fio de 1px. Nada preenche a largura toda.", "tipografia": "Serifa em peso 300 no título — leve para o tamanho — com corpo em sans light e leading de 2. Marca em caixa-alta com tracking de .36em.", "espacamento": "Leading 2 no corpo é o espaçamento principal. Padding de 70px no hero e 34px nas células; o vazio entre blocos é maior que qualquer elemento.", "cor": "Terra dessaturada: papel washi, fio bege, cinza-terra para apoio, quase-preto para texto e um único acento de terracota que aparece três vezes no total.", "superficie": "Grão de papel em multiply a 30% sobre tudo. Fios de 1px, nunca 2px. Nenhuma sombra.", "movimento": "Sem animação. O único gesto é o CTA, cuja entreletra abre de .2em para .26em em 400ms — lento de propósito.", "mobile": "As duas colunas viram uma, com o ensō abaixo do texto; a faixa de três células empilha com fio inferior.", "aplicacoes": "Artesanato, cerâmica, hotelaria de nicho, marca que vende tempo e processo. Conflita com contextos de urgência ou promoção.", "especifico": "O ensō e os kanji são deste exemplo; a regra geral é assimetria, vazio dominante e superfície com textura, não o repertório japonês literal."}, "duotone": {"principios": "Restrição cromática extrema: duas cores, e todo tom intermediário nasce de blend, não de escolha. A limitação é o que dá unidade.", "composicao": "Nav, hero em duas colunas (texto à esquerda, placa quadrada à direita), faixa de três números. A placa é o único elemento com proporção fixa (1:1).", "tipografia": "Grotesca em 700 no título com tracking -.045em; rótulos em caixa-alta 9.5px com tracking .2em. Números em 30px como âncora visual.", "espacamento": "Padding de 28px lateral constante; gap de 32px entre as colunas do hero. As três células do rodapé dividem a largura igualmente.", "cor": "Exatamente duas: azul-noite de fundo e coral de destaque. O cinza-azulado do texto de apoio é a mistura das duas, não uma terceira escolha.", "superficie": "Manchas desfocadas em mix-blend-mode screen sobre o fundo, e uma em multiply para escurecer. A placa recebe scanlines em multiply.", "movimento": "Quase estático — as manchas não se movem. Só transições de botão e link.", "mobile": "Hero vira uma coluna com a placa centralizada e limitada a 220px; as três células empilham.", "aplicacoes": "Selo musical, festival, capa, campanha de curta duração. Menos indicado para interface densa, onde duas cores não bastam para sinalizar estado.", "especifico": "O par azul-coral é deste exemplo. O que define o estilo é a contagem de cores e o uso de blend para gerar os tons intermediários."}, "bento-grid": {"principios": "Cada compartimento carrega um dado e se explica sozinho. A hierarquia vem do tamanho da caixa, não do peso do texto dentro dela.", "composicao": "Grade de quatro colunas com linha de altura fixa em 118px. Caixas ocupam 1, 2 ou 4 módulos via span; a caixa-herói ocupa 2×2 e ancora o canto superior esquerdo.", "tipografia": "Sans neutra: rótulo em 10px caixa-alta com tracking .16em, número em 38px/800, apoio em 12.5px. Três níveis, sem meio-termo.", "espacamento": "Gap de 12px uniforme entre todas as caixas e padding de 20px dentro de cada uma. A regularidade do gap é o que faz a grade ser lida como grade.", "cor": "Fundo cinza-claro com caixas brancas; três caixas recebem cor sólida (azul, lima, areia) e duas invertem para quase-preto. A cor marca importância, não categoria.", "superficie": "Raio de 22px — grande o bastante para ler como compartimento. Borda de 1px quase invisível; a sombra só aparece no hover.", "movimento": "Elevação de 5px com sombra no hover, em 320ms com curva elástica. As barras do gráfico pulsam em loop.", "mobile": "Quatro colunas viram duas em 980px e uma em 760px; a caixa-herói mantém span 2 enquanto houver duas colunas. A altura da linha cai para 104px.", "aplicacoes": "Dashboard, portfólio, página de visão geral, release notes. Ruim para texto corrido — o formato pede dados discretos.", "especifico": "O azul de acento e a proporção 4 colunas são deste exemplo; o essencial é a linha de altura fixa com span variável."}, "material-you": {"principios": "Uma cor-semente gera toda a escala tonal, e cada superfície é um passo dessa escala. Elevação se comunica por tom antes de se comunicar por sombra.", "composicao": "App bar, campo de busca em pílula, contêiner de destaque com raio 28px, grade de três cards e barra de navegação inferior. Estrutura de aplicativo, não de página.", "tipografia": "Roboto em pesos 400 e 500 apenas — o sistema evita 700. Título em 20px/400 na barra e 32px/400 no destaque: tamanho faz a hierarquia, peso não.", "espacamento": "Margem lateral de 18px, gap de 14px entre cards, padding de 28px no contêiner de destaque. Alvos de toque de 40px de altura mínima.", "cor": "Primária violeta, container em violeta claro, superfície quase branca com viés violeta, contorno cinza-violeta. Nenhum cinza neutro puro — todos têm o viés da semente.", "superficie": "Raio de 16px em cards e 28px em contêineres. Sombra apenas no FAB; o resto usa tom e contorno de 1px.", "movimento": "Véu da cor primária a 10% no hover (state layer), elevação do FAB em 250ms. Transições curtas e sempre reversíveis.", "mobile": "Os três cards empilham; a barra inferior já é o padrão mobile do sistema e permanece. Os chips de filtro somem no espaço estreito.", "aplicacoes": "Aplicativo Android, produto multiplataforma que quer parecer nativo, ferramenta interna. Carrega a leitura de 'app do Google'.", "especifico": "O violeta é a semente deste exemplo — o sistema é feito para trocá-la. As proporções de raio e os papéis tonais é que são a regra."}, "neumorfismo": {"principios": "O componente tem a mesma cor do fundo; o relevo é inteiramente sombra. Extrudado e escavado são a mesma declaração com o sinal trocado.", "composicao": "Nav em pílula, hero centralizado curto, três cards iguais. Composição simétrica e calma — a atenção fica nos controles, não no layout.", "tipografia": "Geométrica arredondada em 600/700, com sombra de texto branca de 1px que reforça o relevo. Corpo em 400, 12.5–14px.", "espacamento": "Padding de 26–28px e raio de 20–26px, proporcionais entre si: quanto maior o bloco, maior o raio. Gap de 20px entre cards.", "cor": "Monocromático quase inteiro — um azul-acinzentado claro, com sombra azulada e luz branca. O texto é o único elemento com contraste real.", "superficie": "Dupla sombra em direções opostas: escura em baixo-direita, branca em cima-esquerda. No :active as duas invertem para inset e o objeto afunda.", "movimento": "Translação de 2–3px no hover e inversão de sombra no clique, ambas em ~220ms. O feedback tátil é o ponto do estilo.", "mobile": "Os três cards empilham; o menu da nav some. As sombras mantêm o mesmo raio — reduzi-las quebraria a leitura de relevo.", "aplicacoes": "Painel de controle, player, ajustes, protótipo de hardware. Limitação séria de contraste: nunca use para texto longo ou indicação de foco.", "especifico": "O azul-acinzentado é deste exemplo, mas a família de cor importa: o efeito depende do fundo ser médio-claro, e falha em fundo branco puro ou muito escuro."}, "claymorphic": {"principios": "Volume macio e convidativo. É o neumorfismo com espessura e cor: sombra externa para massa, sombras internas para dar parede ao objeto.", "composicao": "Nav em pílula, hero centralizado com título em duas linhas, três cards iguais com ícone circular. Simetria e centralização são parte do tom lúdico.", "tipografia": "Arredondada em 900 nos títulos e 600 no corpo — pesos altos combinam com o volume. Título em clamp(28px,5vw,48px) com tracking -.035em.", "espacamento": "Raio de 26–34px, padding de 22–26px. Os raios grandes exigem padding grande: encostar texto na curva quebra o efeito.", "cor": "Pastel lilás de fundo com cards quase brancos e gradientes de rosa, verde-menta e amarelo nos ícones. Texto em roxo escuro, nunca preto.", "superficie": "Quatro sombras por objeto: externa difusa embaixo, luz externa em cima, inset escura e inset clara. É a receita completa do estilo.", "movimento": "Elevação de 8px com rotação de -1.2deg no hover dos cards; os ícones deformam o border-radius em loop de 9s. No :active o botão afunda.", "mobile": "Cards empilham e a nav perde os links. Raio e sombras não mudam — o volume é a identidade.", "aplicacoes": "Produto infantil ou educacional, app de bem-estar, onboarding, marca que quer parecer acessível. Inadequado para contexto formal ou denso.", "especifico": "A paleta pastel é deste exemplo. A regra do estilo é a combinação de sombra externa + duas internas e o raio alto, não o rosa e o lilás."}, "dados-densos": {"principios": "Densidade é a funcionalidade. Cada pixel de padding é decisão de produto, e ornamento é ruído que ocupa espaço de dado.", "composicao": "Barra de abas, cabeçalho de tabela, linhas de 22px, painel dividido em gráfico e pares chave-valor, ticker no rodapé. Tudo alinhado a uma grade de colunas rígida.", "tipografia": "Monoespaçada em 10–11px com font-variant-numeric:tabular-nums — é isso que faz os dígitos alinharem em coluna. Rótulos em 9px caixa-alta.", "espacamento": "Padding de 4px 9px nas células. Linha de 22px. Nada respira: o objetivo é caber o máximo de linhas na dobra.", "cor": "Fundo quase preto, texto bege-claro, âmbar para a marca e os rótulos, verde e vermelho exclusivamente para alta e baixa. Cor é sinal, nunca decoração.", "superficie": "Zero raio, zero sombra. Divisões por fio de 1px em tom levemente mais claro que o fundo.", "movimento": "Barras do gráfico pulsando e ticker deslizando em 26s. Ambos comunicam 'ao vivo' — não são decorativos.", "mobile": "A tabela reduz de seis para quatro colunas escondendo mín/máx; o painel duplo empilha. A densidade permanece: reduzir a fonte seria mais fiel que aumentar o padding.", "aplicacoes": "Mesa de operações, monitoramento, ferramenta de analista, log. Exige usuário treinado — é hostil ao visitante casual.", "especifico": "O âmbar sobre preto e os tickers brasileiros são deste exemplo; o que define o estilo é a densidade, o tabular-nums e a cor como sinal."}, "isotype": {"principios": "Quantidade maior se mostra com mais signos, nunca com signo maior. A comparação se lê contando, e é isso que torna o gráfico honesto.", "composicao": "Cabeçalho escuro, bloco de título, linhas de dados em três colunas (rótulo / pictogramas / número), legenda separada por régua grossa.", "tipografia": "Geométrica em 600/700, tamanhos pequenos e constantes. O número à direita em 16px/700 é o único destaque tipográfico.", "espacamento": "Gap de 4px entre pictogramas e 16px entre as colunas da linha. Padding de 13px vertical por linha — suficiente para separar séries sem soltar a leitura.", "cor": "Creme de fundo, quase-preto para estrutura, e três cores de série (vermelho-tijolo, mostarda, azul-aço). Cada série tem uma cor fixa, repetida na legenda.", "superficie": "Totalmente plana. Régua de 3px separa seções; fio de 1px separa linhas.", "movimento": "Nenhum. O estilo é de impressão e a leitura depende de contagem estável.", "mobile": "As colunas estreitam (130px→92px no rótulo) e os pictogramas quebram em mais linhas; a legenda empilha.", "aplicacoes": "Relatório social, censo, material didático, jornalismo de dados. Ruim para valores contínuos ou com muitas casas decimais.", "especifico": "O pictograma humano e a paleta de terra são deste exemplo; a regra de Neurath é a repetição de uma unidade fixa, com qualquer signo e qualquer cor."}, "glassmorphism": {"principios": "Translucidez que revela contexto sem perder legibilidade. Sem algo colorido e em movimento atrás, o efeito não existe — o vidro depende do que ele desfoca.", "composicao": "Três camadas declaradas: orbs de cor no fundo, painéis de vidro no meio, texto por cima. Nav em pílula, hero centralizado, três cards iguais.", "tipografia": "Sans neutra em 800 no título e 500–600 nos rótulos, branca sobre fundo escuro. Valor numérico em 26px/800 como âncora de cada card.", "espacamento": "Padding de 24px nos cards e 34px na seção; raio de 22px nos painéis e 100px na nav. O raio grande na barra é o que a faz ler como objeto flutuante.", "cor": "Fundo roxo-escuro com três orbs saturados (rosa, ciano, âmbar). O branco translúcido dos painéis é a quarta 'cor', gerada pela sobreposição.", "superficie": "backdrop-filter blur(28px) saturate(180%), borda de 1px branca a 20% e inset superior branco a 35% simulando a quina do vidro. A saturação é o que evita o cinza morto.", "movimento": "Orbs derivam em 18–26s; cards sobem 7px no hover. O movimento lento do fundo é o que faz o vidro parecer vidro.", "mobile": "Os três cards empilham e os links da nav somem, mantendo só marca e botão. Os orbs continuam — são o fundo do efeito.", "aplicacoes": "Painel de sistema, app de música, tela de configurações, marca tecnológica. Cuidado com contraste: texto pequeno sobre vidro falha em fundo claro.", "especifico": "A paleta roxo-rosa-ciano é deste exemplo. O que define o estilo é blur + saturate + borda clara + inset de topo."}, "liquid-glass": {"principios": "O vidro deixa de ser véu fosco e passa a ser lente: a borda concentra luz e o conteúdo de baixo é distorcido, não apenas desfocado.", "composicao": "Nav em pílula, hero à esquerda com medida curta, painel de controles em grade de 4 colunas com blocos de 1 e 2 módulos. Tudo sobre fundo de gradiente vivo.", "tipografia": "Sans em 600 — mais leve que o glassmorphism — com sombra de texto suave para sustentar contraste sobre fundo claro e saturado.", "espacamento": "Raio de 22px nos blocos, 26px na nav e 32px no painel: o contêiner tem raio maior que o conteúdo, o que reforça o encaixe.", "cor": "Gradiente de quatro pontos (âmbar, rosa, azul, violeta) como fundo; os painéis não têm cor própria, só transparência.", "superficie": "Rim especular de .5px a 60% de branco, mais quatro sombras inset (topo, base e duas laterais) simulando a luz que dobra na espessura. Um ::after cruza uma varredura diagonal.", "movimento": "Blobs derivando devagar e elevação de 4px com leve escala no hover dos blocos. Nada brusco — a lente pede continuidade.", "mobile": "O painel cai de 4 para 2 colunas em 980px e para 1 em 760px; o bloco largo perde o span. O hero mantém a medida curta.", "aplicacoes": "Central de controle, overlay de sistema, app de mídia. Custa GPU: muitos painéis simultâneos derrubam o desempenho em máquina modesta.", "especifico": "A refração real é nativa de plataforma; aqui ela é aproximada por inset e rim. Vale declarar isso ao usar o exemplo — não é o efeito do sistema operacional."}, "aurora-mesh": {"principios": "Luz difusa sobre fundo quase preto para sugerir sofisticação sem ornamento. A malha de cor é atmosfera; o conteúdo permanece sóbrio.", "composicao": "Nav de largura total, hero centralizado com medida curta, três cards iguais, rodapé com fio. Composição convencional — a personalidade está no fundo.", "tipografia": "Sans em 600 com tracking -.045em no título; corpo em cinza-lavanda. Gradiente aplicado apenas em uma palavra do título, via background-clip.", "espacamento": "Padding de 66px no topo do hero e 26px lateral; gap de 14px entre cards. O respiro vertical grande é o que dá o ar 'premium'.", "cor": "Quatro manchas (índigo, azul, magenta, turquesa) em mix-blend-mode screen sobre quase preto. O texto usa dois cinzas com viés lavanda, nunca cinza neutro.", "superficie": "Grade técnica esmaecida por mask-image radial, e bordas em gradiente feitas com o truque padding-box/border-box. Um fio de luz no topo de cada card.", "movimento": "Manchas derivando em 26–34s e elevação de 4px com glow no hover. O ponto verde do badge pulsa.", "mobile": "Cards empilham; os links da nav somem, ficando marca e CTA. A malha e a grade permanecem.", "aplicacoes": "Landing de SaaS, produto de infraestrutura, changelog, documentação de API. Virou quase padrão do setor — pouco diferenciador hoje.", "especifico": "A combinação índigo-magenta-turquesa é deste exemplo. A técnica que define o estilo é screen + blur alto + borda em gradiente."}, "skeuomorfismo": {"principios": "A interface imita objeto real para ensinar o uso pela metáfora. Cada elemento declara material: couro, linho, papel pautado, vidro do LED.", "composicao": "Barra de couro no topo, folha de papel com margem e pauta ocupando o corpo, três painéis de instrumento embaixo. Hierarquia por material, não por escala.", "tipografia": "Sans neutra com text-shadow branco de 1px — o efeito 'gravado' que o estilo usa em todo rótulo. Título de 34px alinhado à pauta.", "espacamento": "A pauta de 27px dita o ritmo: o line-height do corpo é exatamente 27px para o texto cair sobre a linha. Padding lateral de 24px após a margem vermelha.", "cor": "Marrom de couro, bege de linho, papel creme, e azul, verde e laranja nos LEDs. Nenhuma cor é chapada — todas são gradiente.", "superficie": "Três camadas por objeto: gradiente de volume, inset de luz no topo, sombra projetada embaixo. Textura de linho em gradientes cruzados de 5px; costura em border dashed.", "movimento": "Só o :active dos botões, que inverte o gradiente e afunda a sombra. Barras de progresso animam em loop.", "mobile": "A folha perde padding e a margem vermelha aproxima; os painéis empilham em uma coluna.", "aplicacoes": "Produto nostálgico, simulador de instrumento, app de áudio, interface para público não técnico. Pesado de manter e difícil de escalar.", "especifico": "Couro e papel pautado são a metáfora deste exemplo. A regra geral é a tripla camada de gradiente + inset + sombra, aplicável a qualquer material."}, "frutiger-aero": {"principios": "Otimismo tecnológico: tecnologia e natureza convivendo sem conflito. Céu, água e folha como promessa de limpeza e transparência.", "composicao": "Barra de vidro flutuante com margem, hero centralizado curto, três cards, faixa de grama no rodapé. O horizonte céu/grama a 62% é a âncora da composição.", "tipografia": "Humanista geométrica em 700 no título, com text-shadow branco duplo que a faz 'brilhar' sobre o céu. Corpo em 500 — o estilo evita pesos leves.", "espacamento": "Margem de 16–18px em torno da barra de vidro (ela flutua, não encosta). Padding de 44px no hero e 20px nos cards.", "cor": "Azul-céu em gradiente para branco, verde-grama saturado, e azul de marca nos botões. Amarelo do sol aparece só como halo radial.", "superficie": "Vidro glossy: gradiente de três paradas, borda branca de 1px, inset de luz e um ::after ocupando a metade superior — é o reflexo que define o botão aqua.", "movimento": "Bolhas subindo em 16s com escala e opacidade; elevação de 4px no hover dos cards. As bolhas são a assinatura do estilo.", "mobile": "Cards empilham; os links da barra somem. O horizonte e as bolhas permanecem — são a identidade.", "aplicacoes": "Produto ambiental, hardware de consumo, marca de bem-estar, revival dos anos 2000. Leitura fortemente datada, o que pode ser o objetivo.", "especifico": "O tema ambiental é deste exemplo. O núcleo do estilo é o botão aqua (gradiente + reflexo na metade superior) e o gradiente céu-grama."}, "neobrutalismo": {"principios": "Estrutura exposta e cor chapada saturada. Nada tenta parecer macio: a sombra não tem blur e a borda não pede licença.", "composicao": "Nav preta de largura total, hero centralizado com título gigante, três cards rotacionados, marquee no rodapé. A rotação de 1–2° é o que quebra a rigidez.", "tipografia": "Display pesadíssima em caixa-alta no título, com text-shadow em duas camadas (rosa e preto) criando profundidade sólida. Corpo em 500.", "espacamento": "Borda de 3–4px e sombra de 7–8px são constantes — mudar a espessura entre elementos quebra o sistema. Padding de 24px nos cards.", "cor": "Amarelo saturado de fundo, com rosa, ciano e verde nos elementos e preto em toda borda. Sem tom intermediário: cada cor é chapada e pura.", "superficie": "box-shadow com blur 0 em tudo. Grade tênue de 34px no fundo, exposta de propósito.", "movimento": "No hover o elemento translada exatamente o valor da sombra e a sombra zera — parece que ele encosta no chão. 130ms, com curva elástica no botão.", "mobile": "Cards empilham e os botões da nav somem. Borda e sombra mantêm a espessura — reduzi-las descaracteriza.", "aplicacoes": "Portfólio criativo, produto jovem, evento, ferramenta que quer parecer honesta e sem polimento. Cansativo em uso prolongado.", "especifico": "O amarelo com rosa e ciano é deste exemplo. A regra é sombra sem blur, borda espessa e cor chapada — a paleta pode ser qualquer uma saturada."}, "brutalismo-radical": {"principios": "Recusa do conforto visual. A página não pede desculpa por ser difícil de olhar, e o desconforto é o argumento.", "composicao": "Faixa de metadados, pilha de tipo em escalas incompatíveis com recuos irregulares (14%, -2%, 44%), réguas de 9px e 5px, três colunas de larguras desiguais (1.6 / .7 / 1.1).", "tipografia": "Display pesada esticada em scaleY(1.28) — a deformação é deliberada. Texto de apoio em monoespaçada de 11.5px. Contraste de escala de 1:12 entre a maior e a menor.", "espacamento": "Padding mínimo de 14px. O espaço é gerado por sobreposição e recuo, não por margem.", "cor": "Papel cinza-claro, preto e um vermelho-sangue. O link mantém o azul padrão do navegador, sem estilizar — é uma declaração.", "superficie": "Sem raio, sem sombra, sem gradiente. Régua preta sólida como único elemento gráfico.", "movimento": "Só o marquee do rodapé, em 14s. Nenhum hover suave.", "mobile": "As três colunas empilham com fio inferior; o carimbo rotacionado some. O tipo esticado permanece e sangra pela moldura — é intencional.", "aplicacoes": "Manifesto, portfólio de arquitetura, publicação independente, página de evento. Inviável para produto que precisa de conversão.", "especifico": "O link azul default e a régua vermelha são deste exemplo. O que caracteriza é a deformação de tipo e a assimetria sem grade confortável."}, "anti-design": {"principios": "Não é ausência de design, é recusa dele. Reproduz os defaults do navegador de 1998 como declaração estética.", "composicao": "Layout em tabela com barra de título, marquee, sidebar de 158px e conteúdo. A estrutura é a da web pré-CSS, deliberadamente.", "tipografia": "Times New Roman no corpo, Comic Sans nos títulos e Verdana nos controles — a mistura é o ponto. Tamanhos sem escala definida.", "espacamento": "Padding pequeno e irregular (5–14px). Nenhum sistema: cada bloco tem o espaçamento que herdou.", "cor": "Teal de fundo com padrão, cinza de sistema, azul-marinho, amarelo, magenta. Links azuis e visitados roxos, sem estilizar.", "superficie": "border ridge, outset e inset — o relevo do Windows 95. Nenhum raio, nenhuma sombra CSS.", "movimento": "Marquee em 18s e texto piscando em steps(1). Ambos eram efeitos nativos da época.", "mobile": "A sidebar empilha acima do conteúdo com fio inferior. O restante já é fluido por ser tabela.", "aplicacoes": "Peça de nostalgia, projeto de arte, página de evento retrô, crítica ao design corporativo. Conscientemente hostil à acessibilidade.", "especifico": "O piscar e o contraste de alguns pares de cor reprovam em WCAG — isso faz parte da citação histórica. Se for usar em produção, mantenha o visual e corrija contraste e movimento."}, "punk-fanzine": {"principios": "Estética de fotocópia e cola bastão. A precisão é inimiga: recorte torto, registro errado e contraste estourado são o vocabulário.", "composicao": "Colagem — fitas adesivas atravessando o quadro, barra levemente rotacionada, manchete em recortes individuais, três cards com clip-path irregular.", "tipografia": "Ransom note: cada letra em família, fundo e rotação diferentes, alternadas por nth-child. Títulos em condensada caixa-alta; recados em manuscrita.", "espacamento": "Gap de 4px entre as letras do recorte e 16px entre cards. A irregularidade das rotações (-4°, 3°, -1.5°, 6°) é o espaçamento real.", "cor": "Papel cinza, preto de tinta e um laranja-vermelho de alerta. Três cores, como a xerox permitia.", "superficie": "Grão de ruído em multiply a 55% e retícula de pontos de 4px por cima. clip-path poligonal simula o corte de tesoura.", "movimento": "Marquee em 13s e o botão que gira no hover. Nada suave.", "mobile": "Os cards empilham; as letras do recorte reduzem de 62px para 34px e continuam quebrando linha naturalmente.", "aplicacoes": "Zine, cartaz de show, selo independente, campanha contracultural. Incompatível com marca institucional.", "especifico": "A frase e as fitas são deste exemplo. O mecanismo do estilo é a variação por nth-child (uma letra, um recorte) e o grão em multiply."}, "editorial": {"principios": "Gramática de revista impressa trazida para a tela: a coluna estreita é tecnologia de leitura, e a capitular marca onde o texto começa.", "composicao": "Masthead com fio duplo assimétrico, abertura em duas colunas (texto + sumário lateral), corpo em três colunas com fio entre elas, fólio no rodapé.", "tipografia": "Serifa display em 900 no título, com itálico de peso 400 misturado na mesma frase. Corpo em 13.5px/1.72 justificado com hifenização. Capitular de quatro linhas.", "espacamento": "column-gap de 26px, padding lateral de 34px. O olho (pull quote) recebe 14px de respiro e réguas de 2px acima e abaixo.", "cor": "Papel creme, tinta quase preta, cinza para apoio e um vermelho-tijolo que marca capitular, kicker e numeração.", "superficie": "Plana. Fios de 1px entre colunas, 2px no olho, 3px no masthead — a espessura do fio comunica hierarquia.", "movimento": "Nenhum. Só a cor do link da nav.", "mobile": "Três colunas viram duas em 980px e uma em 760px; a abertura empilha o sumário abaixo do texto. A capitular é mantida.", "aplicacoes": "Revista, ensaio longo, newsletter, relatório anual. Exige texto real e extenso — falha com conteúdo curto.", "especifico": "O vermelho-tijolo e o assunto são deste exemplo. O que define é column-count com column-rule, capitular flutuante e olho que não parte entre colunas."}, "jornal": {"principios": "Densidade informativa acima de conforto. Diferente da revista: aqui cabe mais, a manchete é condensada e a hierarquia é de urgência.", "composicao": "Cabeçalho de edição, masthead centralizado com fio duplo, chamada principal em duas colunas ao lado de um trilho de breves, faixa de quatro seções.", "tipografia": "Condensada caixa-alta na manchete (até 76px, leading .9); corpo em 12.5px/1.66 justificado com hifenização. Capitular em condensada, não em serifa.", "espacamento": "Padding de 20–24px por bloco e column-gap de 22px. Fio pontilhado separando breves — mais leve que o fio sólido das seções.", "cor": "Papel jornal levemente amarelado, tinta quase preta, cinza de apoio e um vermelho de editoria no kicker.", "superficie": "Plana, com fio duplo de 3px no masthead e no rodapé. O trilho lateral usa fundo levemente mais escuro para se separar.", "movimento": "Nenhum.", "mobile": "A chamada e o trilho empilham com fio inferior; o corpo vai para uma coluna; a faixa de seções vira duas e depois uma coluna.", "aplicacoes": "Veículo de notícia, boletim, publicação local, peça editorial impressa em tela.", "especifico": "A editoria e a previsão do tempo são deste exemplo. A regra é a densidade, a manchete condensada e a hierarquia kicker → manchete → olho → assinatura."}, "luxo": {"principios": "Luxo se constrói por subtração e por lentidão. O vazio comunica exclusividade, e a resposta demorada do controle sugere que nada aqui tem pressa.", "composicao": "Nav com marca centralizada em tracking largo, hero centralizado com fio vertical descendo do topo, três células divididas por fio. Simetria absoluta.", "tipografia": "Serifa em peso 400 — nunca negrito — até 68px. Rótulos em 9px caixa-alta com tracking de .42em: a entreletra extrema é a assinatura do estilo.", "espacamento": "Padding de 96px no hero; leading 2.1 no corpo. O espaço é o produto.", "cor": "Três valores apenas: quase-preto, marfim e um dourado fosco. Nenhum quarto tom.", "superficie": "Plana, com fios de 1px a 14% de opacidade. Nenhuma sombra, nenhum raio.", "movimento": "Transições de 550ms com curva de saída longa. No hover o CTA inverte para dourado e a entreletra abre de .34em para .42em.", "mobile": "As três células empilham com fio inferior; a nav vira coluna. O padding do hero cai, mas continua o maior da página.", "aplicacoes": "Moda, joalheria, hotelaria, imóvel de alto padrão, perfume. Inadequado onde há muita informação ou necessidade de conversão rápida.", "especifico": "O dourado é deste exemplo — preto e branco puro funcionam igual. O que define é o peso 400, a entreletra larga nos rótulos e a transição longa."}, "terminal-ascii": {"principios": "Tudo é texto. A barra de progresso é uma sequência de caracteres, a moldura é box-drawing, e o brilho é o fósforo do tubo.", "composicao": "Barra de status, arte ASCII, linhas de prompt, caixa com moldura de caracteres, rodapé de atalhos. Fluxo vertical contínuo, como um terminal real.", "tipografia": "Monoespaçada em 12.5px/1.62 exclusivamente. A arte ASCII usa clamp(6px,1.5vw,11px) com line-height 1.1 para o desenho fechar.", "espacamento": "Padding de 14–16px. O espaçamento real vem do line-height e do grid implícito do monoespaço.", "cor": "Preto esverdeado, verde-fósforo para o texto, verde claro para destaque, âmbar para aviso e vermelho para erro. Cor é severidade.", "superficie": "Scanline de 1px a cada 3px e vinheta radial simulando a curvatura do tubo. Moldura feita com caracteres, não com border.", "movimento": "Cursor piscando em steps(1) a cada 1s. Nada mais.", "mobile": "As colunas da tabela de build reduzem e a barra de caracteres some; a arte ASCII cai para 5px para não quebrar.", "aplicacoes": "Ferramenta de desenvolvedor, documentação de CLI, projeto hacker, página de status. Público restrito por natureza.", "especifico": "O verde é escolha deste exemplo — âmbar era igualmente comum. A regra é monoespaço total, cor como severidade e composição por caractere."}, "cinetico": {"principios": "O movimento é o conteúdo. O tipo não é texto exibido: é um conjunto de nós que reagem à posição do ponteiro e à velocidade da rolagem.", "composicao": "Nav com telemetria, título dividido em glifos, duas faixas deslizantes em direções opostas, três blocos com parallax. A composição existe para ter o que mover.", "tipografia": "Grotesca em 700 até 92px com leading .94 — apertado para os glifos se influenciarem. Apoio em monoespaçada de 12.5px.", "espacamento": "Padding de 28px; margem de .22em entre palavras para o split não colar. O espaço entre glifos é o campo de ação do efeito.", "cor": "Quase preto, branco-gelo e um violeta de acento que aparece no cursor, no contorno da faixa e nos rótulos.", "superficie": "Plana, com contorno de 1px e raio de 14px nos blocos. O cursor é um radial desfocado de 280px seguindo o ponteiro.", "movimento": "Repulsão por vetor com queda proporcional ao raio (R=160px, deslocamento máximo 34px, escala até 1.28). O marquee é alimentado pela velocidade da rolagem e decai por atrito (vel *= .93), com skew proporcional.", "mobile": "O efeito de ponteiro responde a touchmove, mas o alvo real é desktop. Os três blocos empilham e o parallax reduz de amplitude.", "aplicacoes": "Portfólio de estúdio, lançamento, página de agência, peça de premiação. Exige aviso de movimento e alternativa estática.", "especifico": "A física (R, 34px, .93 de atrito) é ajuste deste exemplo. O estilo é a ideia de tipo como nó reativo — os números são calibráveis."}, "blackletter": {"principios": "Gramática do manuscrito: display em fraktur, corpo em serifa legível, capitular rubricada em vermelho. A regra que mantém tudo utilizável é blackletter só no display.", "composicao": "Masthead centralizado, régua de ornamentos, abertura em duas colunas (texto + selo), três colunas de serviços. Simetria de missal.", "tipografia": "Fraktur no título e na capitular; corpo em serifa de 14px/1.85 justificado com hifenização. Rótulos em sans de 8.5px com tracking .3em — contraste deliberado de época.", "espacamento": "Padding de 34px no hero e 26px nas colunas; leading 1.85 no corpo para o texto denso respirar.", "cor": "Preto de tinta, pergaminho claro, marrom de fio e um vermelho de rubrica usado só em capitular, ornamento e ênfase.", "superficie": "Plana, com fios de 1px em marrom escuro. Um radial avermelhado no topo sugere luz de vela.", "movimento": "Só o selo girando em 44s, quase imperceptível.", "mobile": "A abertura empilha o selo abaixo do texto; as três colunas viram uma com fio inferior. A capitular é mantida.", "aplicacoes": "Editora, cervejaria, banda de metal, tipografia artesanal, encadernação. Alto risco de leitura equivocada se usado sem contexto.", "especifico": "O tema da oficina é deste exemplo. A regra transferível é: fraktur só acima de ~24px e nunca em parágrafo, com corpo em serifa comum."}, "bauhaus": {"principios": "Três primárias associadas a três formas elementares, e nada além. A composição é assimétrica, mas cada peça está rigorosamente alinhada à grade.", "composicao": "Nav com as três formas na marca, hero em duas colunas desiguais (1.25/.75) com painel de formas à direita, três células de largura igual. Régua preta de 3px em toda divisão.", "tipografia": "Geométrica em 700 caixa-alta, leading .98, tracking -.04em. Rótulos em 10px com tracking .3em. Número da célula em 40px como elemento gráfico.", "espacamento": "Régua sempre de 3px, em todo lugar — é a constante do sistema. Padding de 26–40px conforme o peso do bloco.", "cor": "Vermelho, azul e amarelo primários sobre papel off-white, com preto de estrutura. Cada forma tem sua cor: círculo vermelho, triângulo azul, quadrado preto.", "superficie": "Plana e sem raio, exceto o arco (semicírculo) que é forma, não ornamento.", "movimento": "Nenhum. Só o sublinhado vermelho no hover da nav.", "mobile": "O hero empilha com o painel de formas abaixo; as três células viram uma coluna com régua inferior.", "aplicacoes": "Escola, instituição cultural, identidade de design, material didático. Referência tão reconhecível que pode soar citação.", "especifico": "A associação forma-cor (círculo/vermelho) é a de Kandinsky adotada aqui; há registro de que a própria escola divergia sobre ela. Trate como escolha, não como lei."}, "art-deco": {"principios": "Geometria luxuosa e simetria axial absoluta. Tudo se espelha no eixo central, e o ouro aparece como fio, não como área.", "composicao": "Marca centralizada, leque de arcos concêntricos, hero centralizado, três colunas simétricas com forma escalonada. Nenhum elemento fora do eixo.", "tipografia": "Geométrica fina em caixa-alta com tracking de .12em no título e .5em nos rótulos. Corpo em sans light com leading 2.1.", "espacamento": "Padding de 44px no hero e 32px nas colunas. O tracking largo é parte do espaçamento: ele estica a linha horizontalmente.", "cor": "Carvão quase preto e um dourado fosco, com marfim para o texto. Duas cores e um neutro — nada mais.", "superficie": "Plana. Textura de linhas cruzadas a 60° em 10% de opacidade; leque feito de círculos concêntricos recortados; ziggurat feito de três barras decrescentes.", "movimento": "Nenhum. Transição de 450ms no botão, que preenche de dourado.", "mobile": "As três colunas empilham com fio inferior; o leque e a simetria permanecem.", "aplicacoes": "Hotel, teatro, bar, evento de gala, marca de bebida. Pouco adequado a produto digital complexo.", "especifico": "O tema hoteleiro é deste exemplo. O núcleo é a simetria axial, o fio dourado e as formas geométricas escalonadas."}, "art-nouveau": {"principios": "A linha orgânica que a planta ensinou ao ferro. Curva assimétrica — o 'chicote' — em vez da geometria; ornamento estrutural, não aplicado.", "composicao": "Moldura com ornamento nos quatro cantos (um SVG espelhado por transform), nav, hero em duas colunas com ilustração vegetal, três colunas de serviços.", "tipografia": "Serifa display com itálico frequente — o itálico é parte do vocabulário, não ênfase ocasional. Corpo em sans light de 13px/1.95.", "espacamento": "Padding de 44px lateral e moldura a 10px da borda. O respiro interno da moldura é o que evita o aspecto apertado.", "cor": "Pergaminho, oliva escura, terracota e mostarda. Paleta de estufa e vitral, sem nenhum tom frio.", "superficie": "Plana, com ornamento em SVG. O botão tem raio assimétrico (100px 100px 100px 0) que migra de canto no hover.", "movimento": "Só a transição do botão, em 400ms, trocando o canto reto de lugar.", "mobile": "O hero empilha com a ilustração abaixo; as três colunas viram uma com fio inferior. A moldura permanece.", "aplicacoes": "Casa-museu, floricultura, cervejaria artesanal, editora, cartaz cultural. Custoso em ilustração — depende de desenho próprio.", "especifico": "Os ornamentos são desenho deste exemplo. A regra é a curva assimétrica, o espelhamento por transform e o ornamento com função de moldura."}, "construtivismo": {"principios": "A diagonal é força, não enfeite. Duas cores e uma inclinação resolvem o cartaz inteiro; o texto participa da composição como massa geométrica.", "composicao": "Barras diagonais a -18° atravessando o quadro, anel vazado e cunha vermelha, manchete em três linhas com recuos crescentes, três blocos de largura igual.", "tipografia": "Condensada em 700 caixa-alta com leading .88. A terceira linha é vazada (text-stroke, fill transparente) — contraste de peso dentro do mesmo título.", "espacamento": "Padding de 22px e régua de 10px separando hero dos blocos. Cada linha do título recebe um bloco de papel com padding próprio, para sobreviver à diagonal.", "cor": "Papel cru, preto e um vermelho de bandeira. O vermelho ocupa área grande — diferente do suíço, onde ele só marca.", "superficie": "Plana. Anel feito de border de 22px; cunha feita de triângulo por borda; nenhum gradiente.", "movimento": "Faixa deslizante em 17s no rodapé. O botão é inclinado em skewX(-9°) com o texto desinclinado dentro.", "mobile": "Os três blocos empilham com borda inferior; as diagonais permanecem e continuam sangrando.", "aplicacoes": "Cartaz político ou cultural, capa, identidade de coletivo, chamada de evento. Carrega carga histórica forte.", "especifico": "O ângulo de -18° e os blocos de papel atrás do título são solução deste exemplo para manter legibilidade sobre a diagonal."}, "memphis": {"principios": "Forma sem justificativa funcional. Confete geométrico espalhado sem hierarquia, contornado de preto, em paleta que briga de propósito.", "composicao": "Confete absoluto espalhado no fundo (círculo, triângulo, zigue-zague, arco, terrazzo), nav preta, hero centralizado, três cards com raios alternados.", "tipografia": "Geométrica em 800 com tracking -.04em; cada palavra do título em cor e rotação diferentes. Corpo em 500.", "espacamento": "Gap de 18px entre cards; padding de 20px. As rotações de ±1.4° fazem o papel de espaçamento irregular.", "cor": "Creme de fundo com rosa, turquesa, amarelo e lilás. Preto em todo contorno. Paleta dos anos 80, sem harmonização.", "superficie": "Borda de 3px preta e sombra sólida de 6px sem blur. Raios alternados por card (24/4, 4/24, 24 completo) — a inconsistência é o sistema.", "movimento": "Faixa deslizante em 15s; hover que translada e rotaciona levemente.", "mobile": "Cards empilham; os links da nav somem. O confete permanece — é a identidade.", "aplicacoes": "Marca infantil, evento, sorveteria, papelaria, campanha jovem. Difícil de sustentar em interface longa.", "especifico": "A seleção de formas é deste exemplo. A regra é: contorno preto em tudo, formas decorativas sem função, e raios deliberadamente inconsistentes."}, "neo-70s": {"principios": "Calor e curva. O arco é a forma que define a década, e a paleta de terra queimada faz o resto do trabalho.", "composicao": "Sol concêntrico atrás, nav, bloco central em forma de arco (raio 260px no topo), faixa de listras, três cards com um canto muito arredondado.", "tipografia": "Arredondada gorda no título e nos botões; corpo em geométrica 500. Sem caixa-alta — o estilo é falante, não impositivo.", "espacamento": "Padding de 46px dentro do arco, 28px nos cards. O arco precisa de padding-top grande para o texto não encostar na curva.", "cor": "Creme, ferrugem, ocre, mostarda e abacate. Marrom escuro como tinta. Nenhum tom frio.", "superficie": "Borda de 3–4px marrom e sombra sólida deslocada. Sol em repeating-radial-gradient; listras em repeating-linear-gradient com paradas em porcentagem.", "movimento": "Só o hover do botão, que translada 3px e troca de cor.", "mobile": "Os cards empilham; o arco reduz proporcionalmente; a faixa de listras permanece.", "aplicacoes": "Selo de vinil, cafeteria, marca de alimento, festival. Leitura fortemente nostálgica.", "especifico": "A paleta ferrugem-abacate e o arco de 260px são deste exemplo; o essencial é o arco, a curva gorda e a paleta quente de terra."}, "psicodelico": {"principios": "O texto acompanha uma curva, não uma linha. Saturação máxima e vibração cromática — cores que competem entre si de propósito.", "composicao": "Espiral cônica girando ao fundo, gotas derretendo do topo, título em duas ondas de textPath, três pétalas deformadas.", "tipografia": "Arredondada aplicada sobre textPath em SVG — nenhum CSS faz isso sozinho. Contorno escuro de 1.5px para o tipo sobreviver ao fundo saturado.", "espacamento": "Padding de 24–26px; as ondas do textPath definem o ritmo vertical do bloco central.", "cor": "Roxo profundo de fundo com magenta, laranja, amarelo, verde e ciano no arco-íris. Seis matizes em rotação, sem neutro.", "superficie": "repeating-conic-gradient de 36° por ciclo a 30% de opacidade; pétalas com border-radius orgânico animado.", "movimento": "Espiral girando em 60s e pétalas deformando em 11s — lentos de propósito, porque rápido enjoaria. Botão com escala e rotação no hover.", "mobile": "As pétalas empilham; o SVG do título é fluido por viewBox e acompanha a largura.", "aplicacoes": "Cartaz de show, festival, capa, peça cultural. Praticamente inviável para leitura longa.", "especifico": "A frase em onda é deste exemplo. O mecanismo reutilizável é defs>path + text>textPath, e a espiral em repeating-conic-gradient."}, "pop-art": {"principios": "Vocabulário de quadrinho impresso: retícula Ben-Day, balão de fala, contorno grosso e cor primária chapada.", "composicao": "Painéis divididos por borda de 5px, como quadros de HQ. Balão à esquerda, explosão à direita, três células de dados embaixo.", "tipografia": "Display de quadrinho em caixa-alta com tracking de .02–.1em; corpo em geométrica 600. Números com contorno de 2px.", "espacamento": "Borda de 4–5px como separador principal; padding de 20–30px. A borda grossa é o espaçamento.", "cor": "Amarelo de fundo, vermelho, azul e preto. Quatro cores chapadas, sem gradiente.", "superficie": "Retícula de pontos em radial-gradient de 10px a 34% de opacidade. Balão com dois triângulos empilhados formando o rabicho; explosão em clip-path de 16 pontas.", "movimento": "Faixa deslizante em 14s; botão que translada 4px no hover.", "mobile": "Os painéis empilham com borda inferior; as três células viram uma coluna.", "aplicacoes": "Quadrinho, campanha promocional, evento, marca jovem, embalagem. Carrega associação direta a Lichtenstein.", "especifico": "A retícula em vermelho é deste exemplo — no original era ciano ou preto. A regra é Ben-Day + contorno grosso + primárias chapadas."}, "y2k": {"principios": "Otimismo digital do fim do milênio: cromado, neon, grid em fuga e a interface como novidade a ser exibida.", "composicao": "Barra de janela com botões de sistema, hero centralizado, três painéis com moldura de neon, ticker, rodapé. O grid em perspectiva ocupa os 46% inferiores.", "tipografia": "Bitmap (pixel font) no título e nos rótulos, monoespaçada de tela no corpo. Tamanhos pequenos no bitmap para o pixel ser legível.", "espacamento": "Padding de 30–48px; gap de 14px entre painéis. O ticker e a barra são faixas de largura total sem margem.", "cor": "Azul-noite em gradiente para roxo, com ciano e magenta de neon, amarelo de destaque e prata de interface.", "superficie": "Scanline a cada 3px; grid em perspective(280px) rotateX(62deg); título em gradiente com background-clip e duas drop-shadows opostas (holográfico); botões com border outset.", "movimento": "Ticker em 20s, estrelas piscando em 1.6s, barras carregando em 3.4s. Movimento constante faz parte da época.", "mobile": "Os três painéis empilham; o grid e as scanlines permanecem.", "aplicacoes": "Peça nostálgica, evento retrô, marca de música eletrônica, jogo. Datado por definição.", "especifico": "O tema GeoCities é deste exemplo. As técnicas reutilizáveis são o grid em perspectiva, o texto holográfico e a scanline."}, "vaporwave": {"principios": "Nostalgia melancólica, não eufórica como o Y2K. Pôr do sol listrado, grid em fuga e entreletra absurda criando um ritmo lento e vazio.", "composicao": "Sol listrado ao centro, grid de chão em perspectiva, palmeiras silhuetadas nas bordas, hero centralizado, três cards translúcidos.", "tipografia": "Geométrica larga em caixa-alta com letter-spacing de até 1.1em — a entreletra é a assinatura. text-indent compensa o vão final.", "espacamento": "Padding de 64px no hero; gap de 16px entre cards. O espaçamento horizontal vem do tracking, não da margem.", "cor": "Roxo profundo, rosa, ciano, âmbar. Gradiente de pôr do sol em quatro paradas.", "superficie": "Sol com listras recortadas por mask-image na metade inferior; cards com blur leve e borda ciana; scanline sutil em toda a tela.", "movimento": "Faixa deslizante em 24s e elevação no hover. O sol e o grid são estáticos.", "mobile": "Cards empilham, palmeiras somem, sol e grid permanecem.", "aplicacoes": "Música eletrônica, arquivo de áudio, peça de arte, moda de nicho. Estética saturada de uso — difícil parecer original.", "especifico": "A aberração cromática por text-shadow duplo (ciano à esquerda, magenta à direita) e a entreletra de 1.1em são o núcleo transferível."}, "acid-chrome": {"principios": "Metal líquido com franja ácida. O cromado nasce da alternância clara/escura em paradas irregulares — regularidade mataria o efeito.", "composicao": "Manchas de glow ao fundo, dois blobs cromados girando, nav, título gigante em cromado, três cards de vidro escuro.", "tipografia": "Grotesca em 700 até 104px com tracking -.06em. O gradiente do tipo é vertical, porque o horizonte é o que reflete no metal.", "espacamento": "Padding de 26px; gap de 14px. O título ocupa quase toda a largura — é o objeto principal.", "cor": "Quase preto, verde-limão ácido, magenta e ciano no glow; a escala de cinza do cromado é a quinta 'cor'.", "superficie": "conic-gradient de 8 paradas irregulares com blur(.4px) e contrast(1.2) nos blobs; o tipo usa linear-gradient vertical com background-clip e duas drop-shadows ácidas.", "movimento": "Blobs girando em 26–34s; glow derivando. Elevação de 5px no hover.", "mobile": "Cards empilham; o título reduz por clamp; os blobs permanecem.", "aplicacoes": "Drop de produto, moda, música, NFT, peça de hype. Prazo de validade estético curto.", "especifico": "O verde-limão é deste exemplo. O que define é o conic irregular para o metal e o gradiente vertical no tipo."}, "ciberpunk": {"principios": "Terminal de futuro sujo: dois neons em oposição cromática sobre quase preto, tipografia técnica e interface que se anuncia como máquina.", "composicao": "Grade técnica de fundo, linha de varredura descendo, nav com fio neon, hero à esquerda, HUD de três painéis separados por fio de 1px.", "tipografia": "Geométrica técnica em 900 no título e monoespaçada no corpo, com rótulos em caixa-alta e tracking de .18–.24em.", "espacamento": "Padding de 26px; o HUD usa gap de 1px preenchido pela cor do fio — a divisão é o próprio espaçamento.", "cor": "Quase preto, ciano e magenta em oposição, azul-acinzentado para o corpo. Os dois neons nunca se misturam num gradiente.", "superficie": "Chanfro por clip-path nos botões; halo duplo em box-shadow (externo e inset); scanline; grade de 52px.", "movimento": "Varredura em 5.5s, glitch RGB nos últimos 12% de um ciclo de 3.4s, medidores carregando. O glitch é raro de propósito.", "mobile": "O HUD empilha com fio inferior; os links da nav somem.", "aplicacoes": "Jogo, produto de segurança, evento de tecnologia, ficção. Contraste alto exige cuidado com fadiga visual.", "especifico": "Ciano/magenta é a escolha canônica, mas qualquer par complementar funciona. O núcleo é o chanfro, o halo duplo e o glitch por pseudo-elemento."}, "hud-espacial": {"principios": "Instrumentação limpa, ao contrário do ciberpunk: sem neon sujo, sem glitch. Precisão, telemetria e leitura calma.", "composicao": "Campo de estrelas, anéis orbitais à direita, barra de status, painel com cantoneiras, três painéis de telemetria.", "tipografia": "Monoespaçada para dados e geométrica técnica para títulos. Rótulos em 9px com tracking .24em — pequenos porque são etiquetas de instrumento.", "espacamento": "Padding de 22px no painel com cantoneira (elas precisam de espaço para serem lidas como cantoneira) e 16px nos painéis menores.", "cor": "Azul-noite quase preto, ciano de instrumento, verde-água de confirmação, azul-claro para texto. Sem vermelho — não há alarme nesta tela.", "superficie": "Cantoneiras por ::before/::after com border parcial; vidro escuro com blur(10px); anéis com border dashed e um deles com laterais transparentes.", "movimento": "Anéis girando em 18–40s em sentidos opostos; medidores carregando; ponto de enlace pulsando.", "mobile": "Os três painéis empilham; os anéis deslocam para fora e reduzem opacidade.", "aplicacoes": "Painel de telemetria, monitoramento, jogo de simulação, produto aeroespacial, dashboard técnico.", "especifico": "A cantoneira (duas bordas parciais em cantos opostos) é o recurso mais transferível daqui — funciona em qualquer painel técnico."}, "isometrico": {"principios": "Axonometria: a mesma escala em qualquer profundidade, nada encolhe ao fundo. Volume se lê com três faces, nunca quatro.", "composicao": "Grade de chão inclinada, nav com cubo, hero em duas colunas com pilha de placas à direita, três cards com espessura sólida.", "tipografia": "Geométrica em 700 com tracking -.04em; rótulos das placas em 11px caixa-alta.", "espacamento": "Espaçamento vertical entre placas de 34px em translateZ — é o espaçamento do eixo Z, não do fluxo.", "cor": "Azul-noite de fundo, violeta de marca, turquesa, rosa e âmbar nas camadas. Cada camada tem cor própria para ser distinguível.", "superficie": "rotateX(58deg) rotateZ(45deg) com transform-style:preserve-3d. Espessura por box-shadow sólida deslocada (0 8px 0), nunca por blur.", "movimento": "Placas flutuando em 6s com atrasos dessincronizados; botão que afunda a espessura no :active.", "mobile": "O hero empilha e a cena reduz para 210px de altura; os cards viram uma coluna.", "aplicacoes": "Diagrama de arquitetura, produto de infraestrutura, jogo, material explicativo, onboarding técnico.", "especifico": "O par 58°/45° é a convenção adotada aqui; a isometria estrita usa 30°. O essencial é preserve-3d com translateZ e sombra sólida."}, "maximalismo-tatil": {"principios": "Densidade proposital e marca da mão. Nada é corrigido para o esquadro — a irregularidade é destacada, não escondida.", "composicao": "Blobs deformando ao fundo, nav com fio tracejado, hero centralizado com palavras em rotações diferentes, colagem de três peças presas por alfinete.", "tipografia": "Serifa variável em 900 misturada com manuscrita — a manuscrita carrega os recados, a serifa carrega o título. Três famílias no total.", "espacamento": "Gap de 20px entre peças; padding de 22px. As rotações de -1.6°, 1.3° e -.8° fazem o espaçamento parecer manual.", "cor": "Papel kraft, terracota, verde-mata, ocre e marrom escuro. Paleta de ateliê, toda dessaturada em relação ao pigmento puro.", "superficie": "Grão em multiply a 50%; borda de 3px e sombra sólida; raios assimétricos diferentes por peça; alfinete como elemento físico.", "movimento": "Blobs deformando em 14–21s; botão que rotaciona e cresce no hover; faixa manuscrita deslizando em 22s.", "mobile": "A colagem empilha; os links manuscritos da nav somem. Rotações e grão permanecem.", "aplicacoes": "Cerâmica, papelaria, feira, marca artesanal, editora independente. Exige conteúdo real — o estilo expõe placeholder.", "especifico": "Ângulos nunca redondos (-1.6°, 1.3°) e o grão em multiply são o núcleo. A paleta é escolha deste exemplo."}, "flat-organica": {"principios": "Ilustração vetorial sem nenhuma foto, em curvas irregulares. O grão remove o aspecto limpo demais do vetor.", "composicao": "Hero em duas colunas iguais, ilustração SVG à direita com grupos flutuando, faixa de três células com fio.", "tipografia": "Serifa variável em 900 no título com itálico colorido na ênfase; corpo em sans de 14.5px/1.75.", "espacamento": "Gap de 30px entre as colunas; padding de 26px nas células. A ilustração tem altura fixa de 300px.", "cor": "Creme, terracota, dois verdes de folha, ocre e marrom. Paleta de horta, sem preto puro.", "superficie": "Grão em multiply a 42%. Nenhuma sombra; nenhuma forma simétrica; traço pontilhado com stroke-dasharray para textura de linha.", "movimento": "Três grupos flutuando em 7s, 9s e 11s com atrasos negativos — a dessincronização é o que dá vida.", "mobile": "As colunas empilham e a ilustração reduz para 230px; a faixa vira uma coluna.", "aplicacoes": "ONG, cooperativa, alimento, educação, saúde. Bom quando não há acervo fotográfico.", "especifico": "A cena agrícola é deste exemplo. A regra é curva assimétrica, ausência de foto, grão em multiply e flutuação dessincronizada."}, "risografia": {"principios": "A máquina imprime uma tinta por vez e o papel nunca volta no mesmo lugar. Esse erro de registro é o estilo — e não existe degradê.", "composicao": "Manchas de tinta ao fundo, barra com marca desalinhada, manchete gigante com fantasma deslocado, três cards divididos por borda.", "tipografia": "Display pesada em caixa-alta com tracking -.05em. O ::before repete o texto deslocado 4px em outra tinta — é a técnica central.", "espacamento": "Padding de 24px; bordas de 2px entre cards. O deslocamento de registro é de 3–4px, sempre visível mas nunca confuso.", "cor": "Papel off-white e três tintas spot: rosa fluorescente, azul médio e amarelo. Cores que a CMYK não alcança.", "superficie": "Tudo em mix-blend-mode multiply — é assim que as tintas se sobrepõem de verdade. Grão a 50%. Manchas com blur(2px).", "movimento": "Nenhum. É um processo de impressão.", "mobile": "Os cards empilham com borda inferior; o desalinho e as manchas permanecem.", "aplicacoes": "Gráfica, zine, cartaz cultural, capa, convite. Não use degradê: a riso não imprime.", "especifico": "O trio rosa/azul/amarelo é deste exemplo. O núcleo é o ::before com attr(data-t) deslocado em multiply."}, "corporate-memphis": {"principios": "Ilustração chapada de figuras sem rosto, com membros longos e curvos, em poucas cores saturadas. Amigável, genérica e propositalmente sem atrito.", "composicao": "Blobs pastel ao fundo, nav com CTA em pílula, hero em duas colunas com ilustração à direita, três cards de fundo colorido, rodapé escuro.", "tipografia": "Geométrica em 700 com tracking -.04em; corpo em 400 cinza-azulado. Uma família só.", "espacamento": "Padding de 22px nos cards, gap de 18px; raio de 20px. Tudo generoso e arredondado.", "cor": "Violeta de marca, rosa e verde-menta como acentos, azul-escuro para texto, branco de fundo. Blobs em versões a 8% dessas cores.", "superficie": "Plana. Ícone com raio 50% em três cantos e 8px no quarto — a 'folha' que o estilo repete. Nenhuma sombra.", "movimento": "Elevação de 4px no hover. Nada mais — o estilo evita atrito.", "mobile": "Hero empilha com a ilustração abaixo; cards viram uma coluna.", "aplicacoes": "SaaS, fintech, startup, página institucional. Extremamente saturado de uso entre 2018 e 2023 — reconhecer é o primeiro passo para evitar.", "especifico": "No SVG: cabeça pequena, tronco em cápsula, membros como stroke grosso com linecap round, sem rosto e sem contorno. É isso que produz a leitura do estilo."}, "cottagecore": {"principios": "O avesso do painel: calor doméstico, botânica desenhada e escrita à mão. Nada de eficiência — o estilo vende tempo e cuidado.", "composicao": "Grade tênue de 22px ao fundo, nav com links manuscritos, guirlanda coroando o título centralizado, três cards com um canto muito arredondado, faixa de xadrez.", "tipografia": "Serifa em peso 400 no título com itálico na ênfase; manuscrita nos links e no rodapé; sans light de 300 no corpo. Três papéis bem separados.", "espacamento": "Padding de 36px lateral; leading 2 no corpo. A guirlanda exige 52px de margem superior no título para não colidir.", "cor": "Creme, sálvia, rosa seco, trigo e verde-escuro de texto. Paleta lavada, sem saturação alta.", "superficie": "Xadrez gingham feito de dois repeating-linear-gradient cruzados com transparência — o ao": "Quatro camadas de onda no rodapé em tons escalonados, sol recortado, nav, hero centralizado, três cards com folha de trás deslocada.", "tipografia": "Geométrica em 700 com tracking -.04em; rótulo em pílula com tracking .2em. Uma família só — o interesse está na profundidade.", "espacamento": "Padding de 22px nos cards; as camadas ocupam os 62% inferiores com 14–16% de distância entre elas.", "cor": "Creme quente, coral, azul, lilás e roxo-escuro de texto. Cada camada um passo mais escura que a de cima.", "superficie": "drop-shadow(0 -6px 8px) por camada — drop-shadow e não box-shadow, para acompanhar o recorte do SVG. Nos cards, um ::before deslocado na diagonal faz a folha de baixo.", "movimento": "Nenhum. O estilo simula papel parado.", "mobile": "Cards empilham; as camadas acompanham a largura por preserveAspectRatio none.", "aplicacoes": "Livro infantil, animação stop-motion, vitrine, embalagem, campanha sazonal.", "especifico": "A sombra para cima é o núcleo transferível. A paleta coral-azul-lilás é escolha deste exemplo."}}</script>

<template data-style="editorial" data-name="Editorial de Revista" data-group="E" data-root="mag" data-url="revistamargem.com.br/ed-42" data-tags="capitular, multi-coluna, serif display, olho, pull quote, masthead, justificado" data-desc="Gramática de revista impressa trazida para a tela: cabeçalho com fio duplo, título em serif display com itálico misturado, texto em três colunas com &lt;code&gt;column-rule&lt;/code&gt;, capitular de quatro linhas e um &lt;em&gt;pull quote&lt;/em&gt; que corta a coluna." data-palette="#fbf9f5,#f3efe4,#b03a2e,#7a7366,#141310" data-facets="composicao:colunas superficie:plana tipografia:display-serif movimento:estatico" data-fonts="Inter|Playfair Display" data-fontlink="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&amp;display=swap">
      <div class="mag__head">
        <div class="mag__masthead">Margem<em>&nbsp;42</em></div>
        <nav>
          <a href="#editorial">Ensaios</a><a href="#editorial">Entrevista</a>
          <a href="#editorial">Resenhas</a><a href="#editorial">Assine</a>
        </nav>
      </div>
      <div class="mag__rules"></div>
      <div class="mag__feature">
        <div>
          <div class="mag__kicker">Ensaio <i></i> Tipografia</div>
          <h1>A coluna estreita é uma <em>tecnologia</em> de leitura.</h1>
          <div class="mag__standfirst">Sessenta e cinco caracteres por linha não é superstição de tipógrafo: é o ponto em que o olho encontra o começo da linha seguinte sem precisar procurar.</div>
          <div class="mag__byline">Por Helena Ruiz · fotografia de arquivo · 14 min de leitura</div>
        </div>
        <aside class="mag__aside">
          <b>Nesta edição</b>
          <ol>
            <li>O retorno da capitular nas interfaces</li>
            <li>Por que o justificado voltou a funcionar</li>
            <li>Grades de revista aplicadas a produto</li>
            <li>Entrevista: quem desenha para papel em 2026</li>
          </ol>
        </aside>
      </div>
      <div class="mag__body">
        <p>Quando a linha é longa demais, o retorno se torna trabalho. O olho salta de volta à esquerda e precisa achar, entre linhas quase idênticas, qual delas é a próxima. Erra com frequência, relê, cansa. A coluna estreita resolve isso sem que ninguém perceba que havia problema.</p>
        <div class="mag__quote">Uma coluna bem medida não chama atenção para si — ela só faz o leitor continuar.<span>Helena Ruiz</span></div>
        <p>A revista impressa aprendeu isso cedo porque não tinha escolha: o papel é largo e o corpo do texto é pequeno. Dividir em colunas era necessidade física antes de ser decisão estética. Na tela, o mesmo raciocínio voltou tarde, quando as telas ficaram largas e os textos, ilegíveis de ponta a ponta.</p>
        <p>A capitular tem função parecida. Ela marca o início absoluto do texto, o único ponto da página em que o leitor não tem dúvida de onde começar. Serve de âncora — e, não por acaso, sobreviveu mil anos de manuscrito a jornal sem mudar de papel.</p>
        <p>O que mudou foi a distância entre suporte e leitor. O papel não pede escolha; a tela pede, a cada rolagem. É por isso que a página digital precisa ser mais explícita do que a impressa sobre onde a leitura começa e onde ela termina.</p>
      </div>
      <div class="mag__folio"><span>Margem · edição 42 · inverno de 2026</span><span>página 18</span></div>
    
</template>

        <span>Ano CXIV · Nº 41.208</span><span>Serra do Norte, sexta-feira, 12 de setembro de 2026</span><span>R$ 6,00</span>
      </div>
      <div class="news__mast">
        <h1>O Gazeta da Serra</h1>
        <p>fundado em 1912 · independente desde então</p>
      </div>
      <div class="news__lead">
        <div class="news__main">
          <div class="news__kick">Cidade · transporte</div>
          <h2>Linha do bonde volta a operar depois de quarenta anos parada</h2>
          <div class="news__deck">Trecho de 3,2 quilômetros entre a estação velha e o mercado municipal recebeu trilho novo; tarifa será integrada à do ônibus a partir de segunda.</div>
          <div class="news__byline">Por Marcos Vilela · da redação</div>
          <div class="news__cols">
            <p>O primeiro carro saiu do pátio às cinco e quarenta da manhã, sem cerimônia e sem autoridade a bordo, e fez o trajeto completo em dezenove minutos — dois menos do que o previsto no estudo entregue à prefeitura no ano passado.</p>
            <p>A obra levou trinta e um meses, atrasou quatro vezes e custou quase o dobro do orçamento inicial. Ainda assim, foi concluída antes da reforma do viaduto que começou no mesmo mês e segue sem data.</p>
            <p>Nos primeiros quinze dias a viagem será gratuita. Depois disso, quem já tiver pagado ônibus na mesma hora não paga de novo, o que na prática transforma o bonde em extensão da linha 4.</p>
            <p>Moradores da rua do Carmo reclamam do ruído na curva. A concessionária diz que o trilho será lubrificado semanalmente e que o problema desaparece depois do período de assentamento.</p>
          </div>
        </div>
        <div class="news__rail">
          <h3>Breves</h3>
          <div class="news__brief"><b>Feira muda de lugar</b><span>Barracas passam para a praça da matriz enquanto o calçadão é recapeado.</span></div>
          <div class="news__brief"><b>Escola integral</b><span>Duas unidades da zona leste adotam turno único a partir de outubro.</span></div>
          <div class="news__brief"><b>Rio abaixo do nível</b><span>Medição registra a menor vazão para setembro desde 1998.</span></div>
          <div class="news__brief"><b>Time fecha reforço</b><span>Zagueiro assina até o fim da temporada com opção de renovação.</span></div>
          <div class="news__weather">
            <b>21°</b>
            <span>Parcialmente nublado<br>mín 14° · máx 26°<br>chuva 20%</span>
          </div>
        </div>
      </div>
      <div class="news__strip">
        <div class="news__cell"><b>Economia</b><p>Comércio do centro registra alta de 6% nas vendas de agosto.</p></div>
        <div class="news__cell"><b>Cultura</b><p>Cineclube reabre no antigo galpão da estação com sessão gratuita.</p></div>
        <div class="news__cell"><b>Esporte</b><p>Corrida de rua fecha inscrições com número recorde de participantes.</p></div>
        <div class="news__cell"><b>Opinião</b><p>Por que a cidade insiste em resolver trânsito construindo mais asfalto.</p></div>

<script type="text/plain" data-js="cinetico">
(function(){
  var root = document.querySelector('.kin');
  if(!root) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function paused(){ return reduce || document.documentElement.getAttribute('data-motion') === 'off'; }

  var h1 = root.querySelector('[data-split]'), chars = [];
  if(h1){
    var words = h1.textContent.trim().split(' ');
    h1.textContent = '';
    words.forEach(function(w){
      var ws = document.createElement('span'); ws.className = 'kin__word';
      w.split('').forEach(function(c){
        var s = document.createElement('span'); s.className = 'kin__ch'; s.textContent = c;
        ws.appendChild(s); chars.push(s);
      });
      h1.appendChild(ws); h1.appendChild(document.createTextNode(' '));
    });
  }
  var cur = root.querySelector('.kin__cursor');
  var tiles = [].slice.call(root.querySelectorAll('[data-tilt]'));

  function move(e){
    if(paused()) return;
    var r = root.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
    var mx = p.clientX - r.left, my = p.clientY - r.top;
    if(cur){ cur.style.opacity = '1'; cur.style.left = mx + 'px'; cur.style.top = my + 'px'; }
    chars.forEach(function(c){
      var cr = c.getBoundingClientRect();
      var dx = cr.left - r.left + cr.width / 2 - mx, dy = cr.top - r.top + cr.height / 2 - my;
      var dist = Math.sqrt(dx * dx + dy * dy), R = 160;
      if(dist < R){
        var f = 1 - dist / R;
        c.style.transform = 'translate(' + ((dx / (dist || 1)) * f * 34).toFixed(2) + 'px,' +
          ((dy / (dist || 1)) * f * 34).toFixed(2) + 'px) scale(' + (1 + f * .28).toFixed(3) + ')';
        c.style.color = 'hsl(' + (255 - f * 70) + ',90%,' + (72 + f * 22) + '%)';
      } else { c.style.transform = ''; c.style.color = ''; }
    });
    tiles.forEach(function(t, i){
      var tr = t.getBoundingClientRect();
      var ddx = (mx - (tr.left - r.left + tr.width / 2)) / 22;
      var ddy = (my - (tr.top - r.top + tr.height / 2)) / 22;
      var depth = .5 + i * .25;
      t.style.transform = 'translate(' + (ddx * depth).toFixed(2) + 'px,' + (ddy * depth).toFixed(2) + 'px)';
    });
  }
  function leave(){
    if(cur) cur.style.opacity = '0';
    chars.forEach(function(c){ c.style.transform = ''; c.style.color = ''; });
    tiles.forEach(function(t){ t.style.transform = ''; });
  }
  root.addEventListener('mousemove', move);
  root.addEventListener('touchmove', move, { passive:true });
  root.addEventListener('mouseleave', leave);
  root.addEventListener('touchend', leave);

  var mq = [].slice.call(root.querySelectorAll('[data-marquee]'));
  var ticker = root.querySelector('.kin__ticker');
  var lastY = 0, vel = 0, offs = mq.map(function(){ return 0; }), raf = 0;
  addEventListener('scroll', function(){
    var y = (document.scrollingElement || document.documentElement).scrollTop;
    vel += (y - lastY) * .32; lastY = y;
  }, { passive:true });
  function loop(){
    if(paused()){ raf = 0; return; }
    vel *= .93;
    mq.forEach(function(m, i){
      var dir = parseFloat(m.dataset.marquee);
      offs[i] -= (.8 + Math.abs(vel) * .55) * dir * (vel < -.4 ? -1 : 1);
      var w = m.scrollWidth / 2;
      if(w > 0){ if(offs[i] <= -w) offs[i] += w; if(offs[i] >= 0) offs[i] -= w; }
      var sk = Math.max(-9, Math.min(9, vel * .35));
      m.style.transform = 'translateX(' + offs[i].toFixed(2) + 'px) skewX(' + sk.toFixed(2) + 'deg)';
    });
    if(ticker) ticker.textContent = 'VEL ' + Math.abs(vel).toFixed(2) +
      ' \u00b7 DIR ' + (vel > .4 ? '\u2193' : vel < -.4 ? '\u2191' : '\u2014');
    raf = requestAnimationFrame(loop);
  }
  function sync(){ if(!paused() && !raf) raf = requestAnimationFrame(loop);
                   else if(paused() && raf){ cancelAnimationFrame(raf); raf = 0; } }
  sync();
  new MutationObserver(sync).observe(document.documentElement,
    { attributes:true, attributeFilter:['data-motion'] });
})();
</script>
