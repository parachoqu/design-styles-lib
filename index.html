<!doctype html>
<html lang="pt-BR" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Styles Lib</title>
<meta name="description" content="Biblioteca navegável de 47 estilos de web design, com demo ao vivo, prévia responsiva, paleta, receita executável e ficha de direção de arte.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- A interface usa fonte do sistema e pinta sem rede. As fontes abaixo servem às demos
     e são carregadas sem bloquear a renderização. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bangers&family=Caveat:wght@400;700&family=Comic+Neue:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,300;1,9..144,400;1,9..144,600;1,9..144,900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Nunito:wght@400;600;700;900&family=Orbitron:wght@400;600;800;900&family=Oswald:wght@400;500;600;700&family=Pirata+One&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Poiret+One&family=Poppins:wght@400;500;600;700;800&family=Press+Start+2P&family=Righteous&family=Roboto:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" media="print" onload="this.media='all'">

<style>
/* ============================================================
   DESIGN STYLES LIB — SHELL
   Interface da biblioteca. Tudo prefixado .dsl- para não encostar
   no CSS das demos, que é namespaced por estilo.
   Fonte de sistema: a interface pinta sem depender da rede.
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html:not([data-motion="off"]){scroll-behavior:smooth}

:root{
  /* neutros com viés levemente quente — escolhidos, não herdados */
  --bg:#101013;
  --s1:#17171c;
  --s2:#1e1e25;
  --s3:#26262f;
  --line:#2b2b34;
  --line-soft:#212128;
  --tx:#ececed;
  --tx2:#a8a8b3;      /* 7.2:1 sobre --bg */
  --tx3:#84848f;      /* 4.9:1 sobre --bg */
  --accent:#ff5c35;   /* marcador de índice: seleção, foco, contagem */
  --accent-dim:rgba(255,92,53,.16);
  --accent-tx:#ff8a66;
  --ok:#5ecb8a;
  --warn:#ffc46b;

  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --r-s:6px; --r-m:10px; --r-l:16px;
  --bar:56px;
  --pad:clamp(16px,3vw,32px);
}

body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:var(--ui);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,p,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--accent);color:#15100e}

/* foco visível e consistente em toda a interface */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.dsl-skip{
  position:fixed;top:8px;left:8px;z-index:200;transform:translateY(-160%);
  background:var(--accent);color:#15100e;font-weight:650;font-size:14px;
  padding:10px 16px;border-radius:var(--r-s);text-decoration:none;transition:transform .2s;
}
.dsl-skip:focus{transform:none}
.dsl-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ============================================================
   BARRA SUPERIOR
   ============================================================ */
.dsl-top{
  position:sticky;top:0;z-index:60;height:var(--bar);
  display:flex;align-items:center;gap:14px;
  padding:0 var(--pad);
  background:rgba(16,16,19,.88);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.dsl-brand{
  display:flex;align-items:center;gap:9px;flex:none;
  background:none;border:0;padding:6px 8px;margin-left:-8px;cursor:pointer;
  border-radius:var(--r-s);
}
.dsl-brand b{font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.dsl-brand i{
  width:9px;height:9px;border-radius:2px;background:var(--accent);
  display:block;flex:none;
}
.dsl-brand span{font-size:12.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.dsl-brand:hover b{color:var(--accent-tx)}

.dsl-search{position:relative;flex:1;max-width:420px;display:flex;align-items:center}
.dsl-search svg{position:absolute;left:11px;width:15px;height:15px;color:var(--tx3);pointer-events:none}
.dsl-search input{
  width:100%;height:36px;background:var(--s1);
  border:1px solid var(--line);border-radius:var(--r-s);
  padding:0 64px 0 34px;font-size:14px;outline:none;
  transition:border-color .18s,background .18s;
}
.dsl-search input::placeholder{color:var(--tx3)}
.dsl-search input:focus{border-color:var(--accent);background:var(--s2)}
.dsl-search input::-webkit-search-cancel-button{display:none}
.dsl-search kbd{
  position:absolute;right:10px;font:500 11.5px/1 var(--mono);color:var(--tx3);
  border:1px solid var(--line);border-radius:4px;padding:3px 6px;pointer-events:none;
}
.dsl-search input:focus ~ kbd,.dsl-search input:not(:placeholder-shown) ~ kbd{opacity:0}

.dsl-topacts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.dsl-cmpbar{display:inline-flex;gap:8px;align-items:center}
.dsl-cmpbar[hidden]{display:none}

/* botão padrão da interface */
.dsl-btn{
  display:inline-flex;align-items:center;gap:8px;
  height:36px;padding:0 14px;
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r-s);
  font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;
  transition:background .18s,border-color .18s,color .18s;
}
.dsl-btn:hover{background:var(--s2);border-color:var(--s3)}
.dsl-btn[aria-pressed="true"],.dsl-btn.is-on{
  background:var(--accent-dim);border-color:var(--accent);color:var(--accent-tx);
}
.dsl-btn--primary{background:var(--accent);border-color:var(--accent);color:#15100e;font-weight:650}
.dsl-btn--primary:hover{background:#ff714f;border-color:#ff714f}
.dsl-btn--ghost{background:transparent;border-color:transparent}
.dsl-btn--ghost:hover{background:var(--s1);border-color:var(--line)}
.dsl-btn--icon{width:36px;padding:0;justify-content:center}
.dsl-btn svg{width:15px;height:15px;flex:none}
.dsl-btn:disabled{opacity:.4;cursor:not-allowed}

/* ============================================================
   LAYOUT: TRILHO DE FILTROS + CONTEÚDO
   ============================================================ */
.dsl-shell{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:start}
.dsl-rail{
  position:sticky;top:var(--bar);align-self:start;
  height:calc(100vh - var(--bar));overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--line);padding:20px var(--pad) 40px;
  scrollbar-width:thin;scrollbar-color:var(--s3) transparent;
}
.dsl-rail::-webkit-scrollbar{width:8px}
.dsl-rail::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}
.dsl-main{min-width:0;padding:24px var(--pad) 72px}

.dsl-fgroup{margin-bottom:26px}
.dsl-fgroup > h3{
  font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:10px;
}
.dsl-opt{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;border-radius:var(--r-s);
  padding:7px 8px;margin-left:-8px;cursor:pointer;text-align:left;
  font-size:13.5px;line-height:1.35;color:var(--tx2);
  transition:background .14s,color .14s;align-items:flex-start;
}
.dsl-opt .lab{flex:1;min-width:0}
.dsl-opt .box,.dsl-opt .letter{margin-top:1px}
.dsl-opt:hover{background:var(--s1);color:var(--tx)}
.dsl-opt[aria-pressed="true"]{color:var(--tx);font-weight:550}
.dsl-opt .box{
  width:15px;height:15px;border:1.5px solid var(--s3);border-radius:4px;flex:none;
  display:grid;place-items:center;transition:all .14s;
}
.dsl-opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.dsl-opt .box svg{width:11px;height:11px;color:#15100e;opacity:0}
.dsl-opt[aria-pressed="true"] .box svg{opacity:1}
.dsl-opt .n{margin-left:8px;flex:none;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.dsl-opt--radio .box{border-radius:50%}
.dsl-opt--radio[aria-pressed="true"] .box::after{
  content:'';width:6px;height:6px;border-radius:50%;background:#15100e;
}
.dsl-opt--radio .box svg{display:none}
.dsl-opt .letter{
  width:18px;height:18px;border-radius:4px;background:var(--s2);color:var(--tx3);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;
}
.dsl-opt[aria-pressed="true"] .letter{background:var(--accent);color:#15100e}

/* ============================================================
   CABEÇALHO DO CATÁLOGO
   ============================================================ */
.dsl-head{margin-bottom:20px}
.dsl-head h1{
  font-size:clamp(24px,3.2vw,34px);font-weight:680;letter-spacing:-.03em;
  line-height:1.1;margin-bottom:6px;text-wrap:balance;
}
.dsl-head p{font-size:14.5px;color:var(--tx2);max-width:62ch}
.dsl-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 0;margin-bottom:16px;border-bottom:1px solid var(--line-soft);
}
.dsl-count{font-size:13.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.dsl-count b{color:var(--tx);font-weight:650}
.dsl-active{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dsl-pill{
  display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 6px 0 11px;
  background:var(--s2);border:1px solid var(--line);border-radius:100px;
  font-size:12.5px;color:var(--tx2);
}
.dsl-pill b{color:var(--tx);font-weight:600}
.dsl-pill button{
  width:18px;height:18px;border:0;background:none;cursor:pointer;color:var(--tx3);
  border-radius:50%;display:grid;place-items:center;padding:0;
}
.dsl-pill button:hover{background:var(--s3);color:var(--tx)}
.dsl-pill button svg{width:10px;height:10px}
.dsl-sort{margin-left:auto;display:flex;align-items:center;gap:8px}
.dsl-sort label{font-size:12.5px;color:var(--tx3)}
.dsl-sort select{
  height:32px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-s);
  padding:0 8px;font-size:13px;cursor:pointer;
}

/* ============================================================
   GRADE DE CARTELAS
   ============================================================ */
.dsl-grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
}
.dsl-card{
  position:relative;display:flex;flex-direction:column;
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);
  overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;
}
.dsl-card:hover{border-color:var(--s3);transform:translateY(-2px);
  box-shadow:0 12px 28px -14px rgba(0,0,0,.8)}
.dsl-card:focus-within{border-color:var(--accent)}

/* prévia: clone real da demo, escalado e congelado */
.dsl-thumb{
  position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--s2);
  border-bottom:1px solid var(--line);
}
.dsl-thumb__inner{
  position:absolute;top:0;left:0;width:1240px;height:775px;
  transform-origin:top left;pointer-events:none;
}
.dsl-thumb__inner *,.dsl-thumb__inner *::before,.dsl-thumb__inner *::after{
  animation:none!important;transition:none!important;
}
.dsl-thumb__ph{
  position:absolute;inset:0;display:grid;place-items:center;
  color:var(--tx3);font-size:12px;letter-spacing:.06em;
}
.dsl-thumb::after{  /* fecha a prévia com o ground do card, sem borda dura */
  content:'';position:absolute;inset:auto 0 0 0;height:34px;
  background:linear-gradient(transparent,rgba(23,23,28,.9));pointer-events:none;
}
.dsl-cardbody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.dsl-cardtop{display:flex;align-items:baseline;gap:8px}
.dsl-cardtop h3{font-size:15px;font-weight:620;letter-spacing:-.015em;line-height:1.25}
.dsl-cardtop h3 a{text-decoration:none}
.dsl-cardtop h3 a::after{content:'';position:absolute;inset:0;z-index:1}
.dsl-cardtop h3 a:focus-visible{outline:none}
.dsl-card:has(a:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.dsl-num{
  font:600 11.5px/1 var(--mono);color:var(--tx3);margin-left:auto;flex:none;
  font-variant-numeric:tabular-nums;
}
.dsl-facets{display:flex;gap:5px;flex-wrap:wrap}
.dsl-facet{
  font-size:11.5px;color:var(--tx3);background:var(--s2);
  border-radius:4px;padding:2px 7px;white-space:nowrap;
}
.dsl-facet--g{background:var(--accent-dim);color:var(--accent-tx);font-weight:600}
.dsl-swatches{display:flex;gap:4px;margin-top:auto;padding-top:2px}
.dsl-swatches i{width:100%;height:8px;border-radius:2px;display:block;flex:1}
.dsl-cardacts{
  position:absolute;top:9px;right:9px;z-index:2;display:flex;gap:6px;
  opacity:0;transition:opacity .18s;
}
.dsl-card:hover .dsl-cardacts,.dsl-card:focus-within .dsl-cardacts,
.dsl-cardacts:has([aria-pressed="true"]){opacity:1}
@media(hover:none){.dsl-cardacts{opacity:1}}
.dsl-iconbtn{
  width:30px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0;
  background:rgba(16,16,19,.78);border:1px solid var(--line);border-radius:8px;
  color:var(--tx2);backdrop-filter:blur(8px);transition:all .16s;
}
.dsl-iconbtn:hover{background:var(--s2);color:var(--tx);border-color:var(--s3)}
.dsl-iconbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#15100e}
.dsl-iconbtn svg{width:15px;height:15px}

.dsl-empty{
  grid-column:1/-1;padding:56px 24px;text-align:center;
  border:1px dashed var(--line);border-radius:var(--r-l);background:var(--s1);
}
.dsl-empty h3{font-size:17px;font-weight:620;margin-bottom:8px}
.dsl-empty p{font-size:14px;color:var(--tx2);max-width:52ch;margin:0 auto 16px}
.dsl-empty .dsl-btn{margin:0 4px}

/* ============================================================
   VISUALIZAÇÃO INDIVIDUAL
   ============================================================ */
.dsl-view{padding:0 var(--pad) 72px;max-width:1320px;margin:0 auto}
.dsl-vhead{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:20px;
}
.dsl-vtitle{display:flex;align-items:baseline;gap:11px;min-width:0}
.dsl-vtitle h1{font-size:clamp(21px,2.6vw,29px);font-weight:680;letter-spacing:-.03em;line-height:1.15}
.dsl-vtitle .dsl-num{margin-left:0}
.dsl-vnav{margin-left:auto;display:flex;align-items:center;gap:8px}
.dsl-vpos{font:500 12.5px/1 var(--mono);color:var(--tx3);font-variant-numeric:tabular-nums;padding:0 2px}

.dsl-stage{
  display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:22px;align-items:start;
}
.dsl-preview{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
}
.dsl-ptools{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--s2);
}
.dsl-seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:2px;gap:2px}
.dsl-seg button{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
  background:none;border:0;border-radius:4px;cursor:pointer;
  font-size:12.5px;font-weight:550;color:var(--tx3);transition:all .16s;
}
.dsl-seg button:hover{color:var(--tx)}
.dsl-seg button[aria-pressed="true"]{background:var(--s3);color:var(--tx)}
.dsl-seg svg{width:14px;height:14px}
.dsl-pw{margin-left:auto;font:500 12px/1 var(--mono);color:var(--tx3);font-variant-numeric:tabular-nums}
.dsl-frame{
  display:flex;padding:16px;background:
    linear-gradient(45deg,rgba(255,255,255,.014) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.014) 75%),
    linear-gradient(45deg,rgba(255,255,255,.014) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.014) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
  overflow-x:auto;
}
.dsl-frame iframe{
  border:0;display:block;background:#fff;border-radius:var(--r-m);
  box-shadow:0 18px 44px -20px rgba(0,0,0,.9);
  flex:0 0 auto;margin:auto;   /* margin:auto centraliza sem tornar o excesso inalcançável */
  transition:width .28s cubic-bezier(.4,0,.2,1);
}

/* painel lateral da visão individual */
.dsl-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--bar) + 16px)}
.dsl-panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.dsl-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--s2)}
.dsl-tabs button{
  flex:1;height:40px;background:none;border:0;cursor:pointer;
  font-size:13px;font-weight:580;color:var(--tx3);
  border-bottom:2px solid transparent;transition:all .16s;
}
.dsl-tabs button:hover{color:var(--tx)}
.dsl-tabs button[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--accent);background:var(--s1)}
.dsl-tabpanel{padding:15px;max-height:min(66vh,720px);overflow-y:auto;scrollbar-width:thin}
.dsl-tabpanel:focus-visible{outline-offset:-2px}
.dsl-desc{font-size:14px;color:var(--tx2);margin-bottom:14px}

/* paleta */
.dsl-pal{display:flex;flex-direction:column;gap:6px}
.dsl-sw{
  display:flex;align-items:center;gap:11px;width:100%;
  background:var(--s2);border:1px solid var(--line);border-radius:var(--r-s);
  padding:7px 10px;cursor:pointer;text-align:left;transition:all .16s;
}
.dsl-sw:hover{background:var(--s3);border-color:var(--s3)}
.dsl-sw i{width:26px;height:26px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.14)}
.dsl-sw code{font:500 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.02em}
.dsl-sw span{margin-left:auto;font-size:12px;color:var(--tx3)}

/* ficha */
.dsl-sheet dt{
  font-size:11.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-tx);margin-bottom:5px;
}
.dsl-sheet dd{margin:0 0 15px;font-size:14px;color:var(--tx2)}
.dsl-sheet dd:last-child{margin-bottom:0}
.dsl-sheet .note{
  background:var(--s2);border-left:2px solid var(--warn);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:10px 12px;font-size:13.5px;
}

/* receita */
.dsl-rec{display:flex;flex-direction:column;gap:12px}
.dsl-recblock{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--bg)}
.dsl-recblock > header{
  display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--s2);
  border-bottom:1px solid var(--line);
}
.dsl-recblock > header h4{font-size:12.5px;font-weight:620}
.dsl-recblock > header .len{font:500 11.5px/1 var(--mono);color:var(--tx3);margin-left:auto}
.dsl-recblock pre{
  margin:0;padding:11px;overflow:auto;max-height:300px;
  font:400 12.5px/1.65 var(--mono);color:#c6c8d2;white-space:pre;tab-size:2;
}

/* ============================================================
   COMPARAÇÃO
   ============================================================ */
.dsl-cmp{display:grid;gap:16px}
.dsl-cmpgrid{display:grid;gap:16px}
.dsl-cmpcol{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;min-width:0}
.dsl-cmpcol > header{
  display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);
}
.dsl-cmpcol > header h3{font-size:14.5px;font-weight:620;letter-spacing:-.015em}
.dsl-cmpcol iframe{border:0;display:block;width:100%;height:420px;background:#fff}
.dsl-cmptabs{display:none;gap:6px;flex-wrap:wrap}
.dsl-table{width:100%;border-collapse:collapse;font-size:13.5px}
.dsl-table caption{text-align:left;font-size:12px;font-weight:650;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tx3);padding-bottom:10px}
.dsl-table th,.dsl-table td{
  padding:11px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top;
}
.dsl-table thead th{font-size:12px;font-weight:650;color:var(--tx3);white-space:nowrap}
.dsl-table tbody th{font-weight:600;color:var(--tx2);width:132px;white-space:nowrap}
.dsl-table td{color:var(--tx2)}
.dsl-table .pal{display:flex;gap:3px}
.dsl-table .pal i{width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.12)}

/* ============================================================
   TOAST / ANÚNCIOS
   ============================================================ */
.dsl-toast{
  position:fixed;left:50%;bottom:24px;z-index:120;
  transform:translate(-50%,18px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:9px;
  background:var(--s3);border:1px solid var(--line);color:var(--tx);
  font-size:13.5px;font-weight:550;padding:10px 16px;border-radius:100px;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.9);
  transition:transform .26s cubic-bezier(.2,.9,.3,1),opacity .26s;
}
.dsl-toast.is-up{transform:translate(-50%,0);opacity:1}
.dsl-toast code{font:500 13px/1 var(--mono)}
.dsl-toast svg{width:15px;height:15px;color:var(--ok);flex:none}
.dsl-toast--err svg{color:var(--warn)}

/* ============================================================
   RESPONSIVO DO SHELL
   ============================================================ */
.dsl-railtoggle{display:none}
.dsl-scrim{display:none}
@media(max-width:1060px){
  .dsl-shell{grid-template-columns:1fr}
  .dsl-railtoggle{display:inline-flex}
  .dsl-rail{
    position:fixed;inset:var(--bar) auto 0 0;width:min(320px,86vw);height:auto;
    z-index:70;background:var(--bg);border-right:1px solid var(--line);
    transform:translateX(-101%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 60px rgba(0,0,0,.6);
  }
  .dsl-rail.is-open{transform:none}
  .dsl-scrim{

    opacity:0;pointer-events:none;transition:opacity .26s;border:0;
  }
  .dsl-scrim.is-on{opacity:1;pointer-events:auto}
  .dsl-stage{grid-template-columns:1fr}
  .dsl-side{position:static}
  .dsl-tabpanel{max-height:none}

  .dsl-sort{margin-left:0;width:100%}
  .dsl-vhead{gap:10px}

  .dsl-cmptabs{display:flex}
  .dsl-cmpgrid{grid-template-columns:1fr!important}
  .dsl-cmpcol.is-hidden{display:none}
  .dsl-table tbody th{width:auto;display:block;border-bottom:0;padding-bottom:2px}
  .dsl-table td{display:block;padding-top:2px}
  .dsl-table thead{display:none}
  .dsl-table tbody tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
  .dsl-table td::before{

/* ============================================================
   MOVIMENTO
   Precedência: preferência do sistema > pausa manual > padrão.
   Cobre pseudo-elementos, que `*` sozinho não alcança.
   ============================================================ */
html[data-motion="off"] *,
html[data-motion="off"] *::before,
html[data-motion="off"] *::after{
  animation-play-state:paused!important;
  transition-duration:.001ms!important;
  scroll-behavior:auto!important;
}
@media(prefers-reduced-motion:reduce){
  html *,html *::before,html *::after{
    animation-play-state:paused!important;

  }
}
