  set: function(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e){ return false; }
  }
};

/* ============================================================
   1. Dados — lidos do próprio DOM, sem lista paralela
   ============================================================ */
var GRUPOS = {};
$$('script[type="application/json"][data-grupos]').forEach(function(s){
  GRUPOS = JSON.parse(s.textContent);
});
var FICHAS = JSON.parse($('#dsl-fichas').textContent);
var FACET_LABELS = JSON.parse($('#dsl-facetas').textContent);
var BASE_CSS = $('style[data-css="_base"]').textContent;

var STYLES = $$('template[data-style]').map(function(t, i){
  var f = {};
  (t.dataset.facets || '').split(' ').filter(Boolean).forEach(function(pair){
    var kv = pair.split(':');
    (f[kv[0]] = f[kv[0]] || []).push(kv[1]);
  });
  return {
    i: i, n: i + 1,
    slug: t.dataset.style, name: t.dataset.name, group: t.dataset.group,
    root: t.dataset.root, url: t.dataset.url,
    tags: t.dataset.tags, desc: t.dataset.desc,
    fonts: (t.dataset.fonts || '').split('|').filter(Boolean),
    fontlink: t.dataset.fontlink || '',
    palette: (t.dataset.palette || '').split(',').filter(Boolean),
    facets: f,
    tpl: t,
    css: ($('style[data-css="' + t.dataset.style + '"]') || {}).textContent || '',
    js: (function(n){ return n ? n.textContent.trim() : ''; })($('script[data-js="' + t.dataset.style + '"]')),
    hay: ''
  };
});
var BY = {};
STYLES.forEach(function(s){
  BY[s.slug] = s;
  var facetWords = [];
  for(var ax in s.facets) s.facets[ax].forEach(function(v){
    facetWords.push(v, (FACET_LABELS[ax] && FACET_LABELS[ax].opcoes[v]) || '');
  });
  s.hay = norm([s.name, s.tags, GRUPOS[s.group], facetWords.join(' ')].join(' '));
});

/* ============================================================
   2. Estado
   ============================================================ */
var state = {
  q: '', group: 'all', facets: {}, favOnly: false, sort: 'num',
  fav: {}, cmp: []
};
(function(){
  var f = store.get('dsl.fav', []);
  if(Object.prototype.toString.call(f) !== '[object Array]') f = [];
  f.forEach(function(slug){ if(BY[slug]) state.fav[slug] = true; });
})();

var lastCatalog = { scroll: 0, focus: null };
var live = $('#dsl-live');
function announce(msg){ if(live){ live.textContent = ''; setTimeout(function(){ live.textContent = msg; }, 30); } }

/* ============================================================
   3. Movimento — sistema tem precedência sobre a pausa manual
   ============================================================ */
var mqReduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
var manualPaused = store.get('dsl.paused', false) === true;
function motionOn(){ return !(mqReduce && mqReduce.matches) && !manualPaused; }
function applyMotion(){
  root.setAttribute('data-motion', motionOn() ? 'on' : 'off');
  var b = $('#dsl-motion');
  if(b){
    var forced = mqReduce && mqReduce.matches;
    b.setAttribute('aria-pressed', String(!motionOn()));
    b.disabled = !!forced;
    b.title = forced
      ? 'Movimento reduzido pelo sistema operacional — a preferência do sistema tem precedência'
      : (motionOn() ? 'Pausar animações' : 'Retomar animações');
    b.innerHTML = svg(motionOn() ? 'pause' : 'play', true) +
      '<span class="dsl-sr">' + (motionOn() ? 'Pausar animações' : 'Retomar animações') + '</span>';
  }
  $$('iframe[data-dsl]').forEach(postMotion);
}
function postMotion(frame){
  try{ frame.contentWindow.postMessage({ dsl: 'motion', on: motionOn() }, '*'); }catch(e){}
}
if(mqReduce){
  var onChange = function(){ applyMotion(); announce(mqReduce.matches
    ? 'Movimento reduzido ativado pelo sistema.' : 'Preferência de movimento do sistema removida.'); };
  if(mqReduce.addEventListener) mqReduce.addEventListener('change', onChange);
  else if(mqReduce.addListener) mqReduce.addListener(onChange);
}

/* ============================================================
   4. Cópia
   ============================================================ */
var toastEl = $('#dsl-toast'), toastT;
function toast(msg, err){
  if(!toastEl) return;
  toastEl.className = 'dsl-toast' + (err ? ' dsl-toast--err' : '');
  toastEl.innerHTML = svg(err ? 'x' : 'check') + '<span>' + msg + '</span>';
  toastEl.classList.add('is-up');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.classList.remove('is-up'); }, 2200);
  announce(msg);
}
function copy(text, okMsg){
  var done = function(){ toast(okMsg); };
  var legacy = function(){
    try{
      var ta = el('textarea'); ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-2000px;opacity:0';
      doc.body.appendChild(ta); ta.select();
      var ok = doc.execCommand('copy');
      doc.body.removeChild(ta);
      ok ? done() : toast('Não foi possível copiar — selecione o texto e use Ctrl+C', true);
    }catch(e){ toast('Não foi possível copiar — selecione o texto e use Ctrl+C', true); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, legacy);
  } else legacy();
}

/* ============================================================
   5. Documento isolado de uma demo (iframe e receita usam o mesmo)
   ============================================================ */
function fontLink(s){
  return s.fontlink ? '<link rel="stylesheet" href="' + s.fontlink + '">' : '';
}
function demoHTML(s){
  return '<div class="frame__body ' + s.root + '">\n' + s.tpl.innerHTML.trim() + '\n</div>';
}
/* documentos isolados (iframe e receita) precisam do reset de html/body;
   o documento da biblioteca não, senão o fundo vira branco */
var DOC_RESET = 'html,body{margin:0;padding:0}\nbody{background:#fff}\n\n';
function demoCSS(s){ return DOC_RESET + BASE_CSS.trim() + '\n\n' + s.css.trim(); }
function demoJS(s){ return s.js; }

function buildDoc(s, opts){
  opts = opts || {};
  var motionAttr = opts.motion === false ? ' data-motion="off"' : '';
  var bridge = opts.bridge ? '\n<script>' +
    "addEventListener('message',function(e){var d=e.data;if(d&&d.dsl==='motion'){" +
    "document.documentElement.setAttribute('data-motion',d.on?'on':'off');}});" +
    '<\/script>' : '';
  return '<!doctype html>\n<html lang="pt-BR"' + motionAttr + '>\n<head>\n' +
    '<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
    '<title>' + esc(s.name) + '</title>\n' + fontLink(s) + '\n' +
    '<style>\n' + demoCSS(s) + '\n</style>\n</head>\n<body>\n' +
    demoHTML(s) + '\n' +
    (demoJS(s) ? '<script>\n' + demoJS(s) + '\n<\/script>\n' : '') +
    bridge + '\n</body>\n</html>';
}

/* ============================================================
   6. Miniatura — clone real, congelado e inerte
   ============================================================ */
var THUMB_W = 1240, THUMB_H = 775;
function isolateIds(node, prefix){
  var map = {};
  $$('[id]', node).forEach(function(n){
    var old = n.id, nw = prefix + '-' + old;
    map[old] = nw; n.id = nw;
  });
  if(!Object.keys(map).length) return;
  $$('*', node).forEach(function(n){
    Array.prototype.slice.call(n.attributes).forEach(function(a){
      var v = a.value, out = v;
      for(var old in map){
        out = out.split('url(#' + old + ')').join('url(#' + map[old] + ')');
        if(a.name === 'href' || a.name === 'xlink:href'){
          if(v === '#' + old) out = '#' + map[old];
        }
      }
      if(out !== v) n.setAttribute(a.name, out);
    });
  });
}
function neutralize(node){
  $$('a[href]', node).forEach(function(a){ a.removeAttribute('href'); });
  $$('a,button,input,select,textarea,[tabindex]', node).forEach(function(n){
    n.setAttribute('tabindex','-1');
    if('disabled' in n) n.disabled = true;
  });
  $$('[data-split],[data-marquee],[data-tilt]', node).forEach(function(n){
    n.removeAttribute('data-split'); n.removeAttribute('data-marquee'); n.removeAttribute('data-tilt');
  });
}
function mountThumb(box, s){
  if(box.dataset.mounted) return;
  box.dataset.mounted = '1';
  var inner = el('div', { class:'dsl-thumb__inner', 'aria-hidden':'true' });
  if('inert' in inner) inner.inert = true;
  var rootEl = el('div', { class:'frame__body ' + s.root });
  rootEl.innerHTML = s.tpl.innerHTML;
  inner.appendChild(rootEl);
  isolateIds(inner, 'th-' + s.slug);
  neutralize(inner);
  var ph = $('.dsl-thumb__ph', box);
  if(ph) ph.remove();
  box.appendChild(inner);
  scaleThumb(box);
}
function scaleThumb(box){
  var inner = $('.dsl-thumb__inner', box);
  if(!inner) return;
  var w = box.clientWidth;
  if(!w) return;
  inner.style.transform = 'scale(' + (w / THUMB_W).toFixed(4) + ')';
}

/* observador com margem em PIXELS derivada da ALTURA da janela.
   Porcentagem em rootMargin é ambígua entre spec e implementações. */
var thumbIO = null, ioMargin = 0;
function buildIO(){
  if(thumbIO) thumbIO.disconnect();
  ioMargin = Math.round(window.innerHeight * 0.75);
  thumbIO = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      var box = en.target;
      mountThumb(box, BY[box.dataset.slug]);
      thumbIO.unobserve(box);
    });
  }, { root: null, rootMargin: ioMargin + 'px 0px ' + ioMargin + 'px 0px', threshold: 0 });
  $$('.dsl-thumb:not([data-mounted])').forEach(function(b){ thumbIO.observe(b); });
}
var resizeT;
addEventListener('resize', function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){
    var m = Math.round(window.innerHeight * 0.75);
    if(Math.abs(m - ioMargin) > 40) buildIO();
    $$('.dsl-thumb[data-mounted]').forEach(scaleThumb);
    layoutCompare();
  }, 160);
}, { passive:true });

/* ============================================================
   7. Filtro
   ============================================================ */
function results(){
  var q = norm(state.q.trim());
  return STYLES.filter(function(s){
    if(state.favOnly && !state.fav[s.slug]) return false;
    if(state.group !== 'all' && s.group !== state.group) return false;
    for(var ax in state.facets){
      var want = state.facets[ax];
      if(!want.length) continue;
      var has = s.facets[ax] || [];
      var hit = want.some(function(v){ return has.indexOf(v) > -1; });
      if(!hit) return false;
    }
    if(q && s.hay.indexOf(q) < 0) return false;
    return true;
  }).sort(function(a,b){
    if(state.sort === 'nome') return a.name.localeCompare(b.name, 'pt-BR');
    if(state.sort === 'grupo') return a.group === b.group ? a.n - b.n : a.group.localeCompare(b.group);
    return a.n - b.n;
  });
}
function activeFilters(){
  var out = [];
  if(state.q.trim()) out.push({ k:'q', label:'Busca', val:'“' + state.q.trim() + '”' });
  if(state.group !== 'all') out.push({ k:'group', label:'Grupo', val: state.group + ' · ' + GRUPOS[state.group] });
  for(var ax in state.facets) state.facets[ax].forEach(function(v){
    out.push({ k:'facet', ax:ax, v:v, label:FACET_LABELS[ax].nome, val:FACET_LABELS[ax].opcoes[v] });
  });
  if(state.favOnly) out.push({ k:'fav', label:'Filtro', val:'Só favoritos' });
  return out;
}
function clearFilter(f){
  if(f.k === 'q'){ state.q = ''; var i = $('#dsl-q'); if(i) i.value = ''; }
  else if(f.k === 'group') state.group = 'all';
  else if(f.k === 'fav') state.favOnly = false;
  else if(f.k === 'facet'){
    state.facets[f.ax] = (state.facets[f.ax]||[]).filter(function(x){ return x !== f.v; });
    if(!state.facets[f.ax].length) delete state.facets[f.ax];
  }
}
function clearAll(){
  state.q = ''; state.group = 'all'; state.facets = {}; state.favOnly = false;
  var i = $('#dsl-q'); if(i) i.value = '';
}

/* ============================================================
   8. Trilho de filtros
   ============================================================ */
function optBtn(o){
  var b = el('button', {
    class:'dsl-opt' + (o.radio ? ' dsl-opt--radio' : ''), type:'button',
    'aria-pressed': String(!!o.on)
  });
  b.innerHTML =
    (o.letter ? '<span class="letter" aria-hidden="true">' + o.letter + '</span>' : '') +
    '<span class="box" aria-hidden="true">' + (o.radio ? '' : svg('check')) + '</span>' +
    '<span class="lab">' + esc(o.label) + '</span>' +
    (o.n != null ? '<span class="n">' + o.n + '</span>' : '');
  b.addEventListener('click', o.onClick);
  return b;
}
function countIf(fn){ return STYLES.filter(fn).length; }

function renderRail(){
  var rail = $('#dsl-rail');
  rail.innerHTML = '';

  var g1 = el('div', { class:'dsl-fgroup' }, [ el('h3', { text:'Coleção' }) ]);
  g1.appendChild(optBtn({
    radio:true, label:'Todos os estilos', n:STYLES.length, on:state.group === 'all' && !state.favOnly,
    onClick:function(){ state.group = 'all'; state.favOnly = false; renderCatalog(); }
  }));
  g1.appendChild(optBtn({
    label:'Favoritos', n:Object.keys(state.fav).length, on:state.favOnly,
    onClick:function(){ state.favOnly = !state.favOnly; renderCatalog(); }
  }));
  rail.appendChild(g1);

  var g2 = el('div', { class:'dsl-fgroup' }, [ el('h3', { text:'Grupo' }) ]);
  Object.keys(GRUPOS).forEach(function(letter){
    g2.appendChild(optBtn({
      radio:true, letter:letter, label:GRUPOS[letter],
      n:countIf(function(s){ return s.group === letter; }),
      on:state.group === letter,
      onClick:function(){ state.group = (state.group === letter ? 'all' : letter); renderCatalog(); }
    }));
  });
  rail.appendChild(g2);

  Object.keys(FACET_LABELS).forEach(function(ax){
    var meta = FACET_LABELS[ax];
    var g = el('div', { class:'dsl-fgroup' }, [ el('h3', { text:meta.nome }) ]);
    Object.keys(meta.opcoes).forEach(function(v){
      var on = (state.facets[ax] || []).indexOf(v) > -1;
      g.appendChild(optBtn({
        label:meta.opcoes[v], on:on,
        n:countIf(function(s){ return (s.facets[ax]||[]).indexOf(v) > -1; }),
        onClick:function(){
          var cur = state.facets[ax] || [];
          state.facets[ax] = on ? cur.filter(function(x){ return x !== v; }) : cur.concat([v]);
          if(!state.facets[ax].length) delete state.facets[ax];
          renderCatalog();
        }
      }));
    });
    rail.appendChild(g);
  });
}

/* ============================================================
   9. Catálogo
   ============================================================ */
function favBtn(s){
  var b = el('button', {
    class:'dsl-iconbtn', type:'button', 'aria-pressed':String(!!state.fav[s.slug]),
    title:(state.fav[s.slug] ? 'Remover ' : 'Adicionar ') + s.name + ' dos favoritos'
  });
  b.innerHTML = svg('star', !!state.fav[s.slug]) +
    '<span class="dsl-sr">' + (state.fav[s.slug] ? 'Remover ' : 'Adicionar ') + s.name + ' dos favoritos</span>';
  b.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    toggleFav(s.slug); 
    b.setAttribute('aria-pressed', String(!!state.fav[s.slug]));
    b.innerHTML = svg('star', !!state.fav[s.slug]) +
      '<span class="dsl-sr">' + (state.fav[s.slug] ? 'Remover ' : 'Adicionar ') + s.name + ' dos favoritos</span>';
    if(state.favOnly) renderCatalog();
    else renderRail();
  });
  return b;
}
function cmpBtn(s){
  var on = state.cmp.indexOf(s.slug) > -1;
  var full = state.cmp.length >= 3 && !on;
  var b = el('button', {
    class:'dsl-iconbtn', type:'button', 'aria-pressed':String(on),
    title: on ? 'Remover ' + s.name + ' da comparação'
              : (full ? 'Comparação cheia — limite de 3 estilos' : 'Comparar ' + s.name)
  });
  b.innerHTML = svg('cmp') + '<span class="dsl-sr">' +
    (on ? 'Remover ' + s.name + ' da comparação' : 'Adicionar ' + s.name + ' à comparação') + '</span>';
  b.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    toggleCmp(s.slug);
  });
  return b;
}
function toggleFav(slug){
  if(state.fav[slug]) delete state.fav[slug]; else state.fav[slug] = true;
  var ok = store.set('dsl.fav', Object.keys(state.fav));
  announce((state.fav[slug] ? 'Adicionado aos' : 'Removido dos') + ' favoritos: ' + BY[slug].name +
    (ok ? '' : ' (não foi possível salvar neste navegador)'));
}
function toggleCmp(slug){
  var i = state.cmp.indexOf(slug);
  if(i > -1) state.cmp.splice(i, 1);
  else if(state.cmp.length >= 3){ toast('Limite de 3 estilos na comparação', true); return; }
  else state.cmp.push(slug);
  syncCmpUI();
  announce(state.cmp.length ? 'Comparação com ' + state.cmp.length + ' estilo(s)' : 'Comparação vazia');
}
function syncCmpUI(){
  var bar = $('#dsl-cmpbar');
  if(bar){
    bar.hidden = state.cmp.length === 0;
    $('#dsl-cmpn').textContent = state.cmp.length;
    $('#dsl-cmpgo').disabled = state.cmp.length < 2;
  }
  $$('.dsl-card').forEach(function(c){
    var slug = c.dataset.slug, on = state.cmp.indexOf(slug) > -1;
    var b = $('.dsl-iconbtn[data-cmp]', c);
    if(b){
      b.setAttribute('aria-pressed', String(on));
      b.title = on ? 'Remover ' + BY[slug].name + ' da comparação'
        : (state.cmp.length >= 3 ? 'Comparação cheia — limite de 3 estilos' : 'Comparar ' + BY[slug].name);
    }
  });
}
function card(s){
  var c = el('article', { class:'dsl-card', 'data-slug':s.slug });
  var thumb = el('div', { class:'dsl-thumb', 'data-slug':s.slug }, [
    el('div', { class:'dsl-thumb__ph', text:'prévia' })
  ]);
  var acts = el('div', { class:'dsl-cardacts' });
  var fb = favBtn(s); fb.setAttribute('data-fav','');
  var cb = cmpBtn(s); cb.setAttribute('data-cmp','');
  acts.appendChild(fb); acts.appendChild(cb);

  var link = el('a', { href:'#' + s.slug, text:s.name });
  var facets = el('div', { class:'dsl-facets' });
  facets.appendChild(el('span', { class:'dsl-facet dsl-facet--g', text:s.group + ' · ' + GRUPOS[s.group] }));
  ['composicao','superficie','tipografia','movimento'].forEach(function(ax){
    (s.facets[ax] || []).slice(0,1).forEach(function(v){
      facets.appendChild(el('span', { class:'dsl-facet', text:FACET_LABELS[ax].opcoes[v] }));
    });
  });
  var sw = el('div', { class:'dsl-swatches', 'aria-hidden':'true' });
  s.palette.forEach(function(h){ sw.appendChild(el('i', { style:'background:' + h })); });

  var body = el('div', { class:'dsl-cardbody' }, [
    el('div', { class:'dsl-cardtop' }, [ el('h3', null, [ link ]),
      el('span', { class:'dsl-num', text:('0' + s.n).slice(-2) }) ]),
    facets, sw
  ]);
  c.appendChild(thumb); c.appendChild(acts); c.appendChild(body);
  return c;
}
function renderCatalog(keepScroll){
  var main = $('#dsl-main');
  var list = results();

  if(!$('#dsl-catalog')){
    main.innerHTML = '';
    main.appendChild(el('div', { class:'dsl-head' }, [
      el('h1', { text:'Biblioteca de estilos de web design' }),
      el('p', { html:'Quarenta e sete estéticas, cada uma com demo ao vivo, paleta, receita executável e ficha de direção de arte. Filtre por grupo e por características, compare lado a lado e leve o código embora.' })
    ]));
    var bar = el('div', { class:'dsl-bar' });
    bar.innerHTML =
      '<button class="dsl-btn dsl-railtoggle" id="dsl-railbtn" type="button" aria-expanded="false" aria-controls="dsl-rail">' +
        svg('filter') + 'Filtros</button>' +
      '<span class="dsl-count" id="dsl-count"></span>' +
      '<span class="dsl-active" id="dsl-active"></span>' +
      '<span class="dsl-sort"><label for="dsl-sortsel">Ordenar</label>' +
      '<select id="dsl-sortsel"><option value="num">Número</option>' +
      '<option value="nome">Nome</option><option value="grupo">Grupo</option></select></span>';
    main.appendChild(bar);
    main.appendChild(el('div', { class:'dsl-grid', id:'dsl-catalog' }));
    $('#dsl-sortsel').value = state.sort;
    $('#dsl-sortsel').addEventListener('change', function(){ state.sort = this.value; renderCatalog(true); });
    $('#dsl-railbtn').addEventListener('click', toggleRail);
  }

  var grid = $('#dsl-catalog');
  grid.innerHTML = '';
  list.forEach(function(s){ grid.appendChild(card(s)); });

  if(!list.length){
    var fs = activeFilters();
    var box = el('div', { class:'dsl-empty' }, [
      el('h3', { text:'Nenhum estilo com esses filtros' }),
      el('p', { text: fs.length
        ? 'Os filtros ativos não têm interseção. Remova um deles para voltar a ver resultados:'
        : 'Nenhum estilo corresponde à busca.' })
    ]);
    var acts = el('div');
    fs.forEach(function(f){
      var b = el('button', { class:'dsl-btn', type:'button', text:'Remover ' + f.label.toLowerCase() + ': ' + f.val });
      b.addEventListener('click', function(){ clearFilter(f); renderCatalog(); });
      acts.appendChild(b);
    });
    var all = el('button', { class:'dsl-btn dsl-btn--primary', type:'button', text:'Limpar tudo' });
    all.addEventListener('click', function(){ clearAll(); renderCatalog(); });
    acts.appendChild(all);
    box.appendChild(acts);
    grid.appendChild(box);
  }

  $('#dsl-count').innerHTML = '<b>' + list.length + '</b> de ' + STYLES.length + ' estilos';
  var act = $('#dsl-active');
  act.innerHTML = '';
  var fs = activeFilters();
  fs.forEach(function(f){
    var p = el('span', { class:'dsl-pill', html:'<span>' + esc(f.label) + '</span> <b>' + esc(f.val) + '</b>' });
    var x = el('button', { type:'button', title:'Remover filtro ' + f.label + ': ' + f.val, html:svg('x') });
    x.addEventListener('click', function(){ clearFilter(f); renderCatalog(); });
    p.appendChild(x);
    act.appendChild(p);
  });
  if(fs.length > 1){
    var ca = el('button', { class:'dsl-btn dsl-btn--ghost', type:'button', text:'Limpar filtros' });
    ca.addEventListener('click', function(){ clearAll(); renderCatalog(); });
    act.appendChild(ca);
  }
  renderRail();
  syncCmpUI();
  buildIO();
  announce(list.length + ' estilo' + (list.length === 1 ? '' : 's') + ' no resultado.');
  if(!keepScroll && lastCatalog.restore){
    window.scrollTo(0, lastCatalog.scroll);
    if(lastCatalog.focus){
      var a = $('.dsl-card[data-slug="' + lastCatalog.focus + '"] h3 a');
      if(a) a.focus({ preventScroll:true });
    }
    lastCatalog.restore = false;
  }
}

var DEV = { desktop:{ w:1280, icon:'desktop', lab:'Desktop' },
            tablet:{ w:834, icon:'tablet', lab:'Tablet' },
            mobile:{ w:390, icon:'mobile', lab:'Mobile' } };

var frames = [];      /* iframes vivos — descartados ao trocar de visão */

function killFrames(){
  frames.forEach(function(f){
    try{ f.src = 'about:blank'; }catch(e){}
    if(f.parentNode) f.parentNode.removeChild(f);
  });
  frames = [];
}
function makeFrame(s, opts){
  var f = el('iframe', {
    'data-dsl':s.slug, title:'Demonstração do estilo ' + s.name,
    loading:'lazy', scrolling:'no'
  });
  f.setAttribute('srcdoc', buildDoc(s, { motion: motionOn(), bridge:true }));
  f.addEventListener('load', function(){
    postMotion(f);
    if(opts && opts.autoHeight) fitFrame(f);
  });
  frames.push(f);
  return f;
}
function fitFrame(f){
  try{
    var d = f.contentDocument;
    if(!d || !d.body) return;
    var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
    if(h > 40) f.style.height = h + 'px';
  }catch(e){ f.style.height = '640px'; }
}

function recipeBlocks(s){

/* ============================================================
   12. Roteador — pushState só em navegação intencional
   ============================================================ */
function parseHash(){
  var h = (location.hash || '').replace(/^#/, '');
  if(!h || h === '/' ) return { view:'catalog' };
  if(h.indexOf('comparar=') === 0){
    return { view:'compare', slugs:h.slice(9).split(',').filter(function(x){ return BY[x]; }) };
  }
  if(BY[h]) return { view:'style', slug:h };
  /* âncoras da própria interface não são rota */
  if(h.indexOf('dsl-') === 0) return { view:'catalog' };
  return { view:'catalog', unknown:h };
}
function render(){
  var r = parseHash();
  renderedRoute = routeKey(r);
  root.setAttribute('data-view', r.view);
  closeRail();
  if(r.view === 'style'){ renderStyle(r.slug); }
  else if(r.view === 'compare'){
    state.cmp = r.slugs.slice(0, 3);
    renderCompare();
  }
  else {
    killFrames();
    if(r.unknown) toast('Estilo “' + r.unknown + '” não existe nesta biblioteca', true);
    var had = !!$('#dsl-catalog');
    if(!had) $('#dsl-main').innerHTML = '';
    renderCatalog();
  }
}
function go(hash, replace){
  if(parseHash().view === 'catalog'){
    lastCatalog.scroll = window.scrollY;
  }
  if(hash && parseHash().view !== 'catalog'){ /* mantém a origem salva */ }
  var target = hash ? '#' + hash : location.pathname + location.search;
  if(!hash) lastCatalog.restore = true;
  try{
    if(replace) history.replaceState({ dsl:1 }, '', target);
    else history.pushState({ dsl:1 }, '', target);
  }catch(e){ location.hash = hash; }
  render();
}
var renderedRoute = null;
addEventListener('popstate', function(){
  if(parseHash().view === 'catalog') lastCatalog.restore = true;
  render();
});
/* o endereço também muda sem popstate: digitado na barra, ou por link externo */
addEventListener('hashchange', function(){
  if(routeKey(parseHash()) === renderedRoute) return;
  render();
});
function routeKey(r){
  return r.view + ':' + (r.slug || (r.slugs || []).join(',') || '');
}

/* ============================================================
   13. Interface global e início
   ============================================================ */
function toggleRail(){
  var r = $('#dsl-rail'), b = $('#dsl-railbtn'), sc = $('#dsl-scrim');
  var open = !r.classList.contains('is-open');
  r.classList.toggle('is-open', open);
  if(sc) sc.classList.toggle('is-on', open);
  if(b) b.setAttribute('aria-expanded', String(open));
  if(open){ var f = $('.dsl-opt', r); if(f) f.focus(); }
}
function closeRail(){
  var r = $('#dsl-rail'), b = $('#dsl-railbtn'), sc = $('#dsl-scrim');
  if(r) r.classList.remove('is-open');
  if(sc) sc.classList.remove('is-on');
  if(b) b.setAttribute('aria-expanded','false');
}

doc.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
  if(!a) return;
  var h = a.getAttribute('href').slice(1);
  if(!BY[h]) return;
  e.preventDefault();
  if(parseHash().view === 'catalog'){
    lastCatalog.scroll = window.scrollY;
    lastCatalog.focus = h;
  }
  go(h, false);
});

doc.addEventListener('keydown', function(e){
  if(e.key === '/' && doc.activeElement !== $('#dsl-q') && !/^(INPUT|TEXTAREA|SELECT)$/.test(doc.activeElement.tagName)){
    e.preventDefault(); $('#dsl-q').focus(); $('#dsl-q').select();
  } else if(e.key === 'Escape'){
    var r = $('#dsl-rail');
    if(r && r.classList.contains('is-open')){ closeRail(); $('#dsl-railbtn').focus(); return; }
    if(doc.activeElement === $('#dsl-q') && $('#dsl-q').value){
      $('#dsl-q').value = ''; state.q = ''; renderCatalog(true); return;
    }
    if(parseHash().view !== 'catalog') go('', false);
  }
});

function init(){
  applyMotion();
  var skip = $('.dsl-skip');
  if(skip) skip.addEventListener('click', function(e){
    e.preventDefault();
    var m = $('#dsl-main');
    m.focus({ preventScroll:true });
    m.scrollIntoView({ block:'start' });
  });
  var q = $('#dsl-q');
  var t;
  q.addEventListener('input', function(){
    clearTimeout(t);
    t = setTimeout(function(){
      state.q = q.value;
      if(parseHash().view !== 'catalog') go('', false);
      else renderCatalog(true);
    }, 130);
  });
  $('#dsl-brandbtn').addEventListener('click', function(){ go('', false); });
  $('#dsl-motion').addEventListener('click', function(){
    manualPaused = !manualPaused;
    store.set('dsl.paused', manualPaused);
    applyMotion();
    announce(motionOn() ? 'Animações retomadas.' : 'Animações pausadas.');
  });
  $('#dsl-cmpgo').addEventListener('click', function(){ go('comparar=' + state.cmp.join(','), false); });
  $('#dsl-cmpclr').addEventListener('click', function(){ state.cmp = []; syncCmpUI(); renderCatalog(true); });
  var sc = $('#dsl-scrim'); if(sc) sc.addEventListener('click', closeRail);
  $('#dsl-total').textContent = STYLES.length;
  render();
}
if(doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
</body>
</html>
